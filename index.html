```html
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>A Letter For You</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    background: #eee7e9;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

/* =========================
   BOOK
========================= */

.book {
    position: relative;
    width: min(90vw, 900px);
    aspect-ratio: 2 / 1.4;
    perspective: 2500px;
}

/* =========================
   PAGE
========================= */

.page {
    position: absolute;
    width: 50%;
    height: 100%;
    right: 0;

    transform-origin: left center;
    transform-style: preserve-3d;

    transition:
        transform 1.1s cubic-bezier(.65,.05,.36,1);

    cursor: pointer;
}

/* halaman yang sedang dibalik */

.page.flipped {
    transform: rotateY(-180deg);
}

/* =========================
   FRONT & BACK
========================= */

.page-face {
    position: absolute;
    inset: 0;

    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;

    background: white;

    overflow: hidden;

    box-shadow:
        0 5px 20px rgba(0,0,0,.12);
}

.page-face img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

/* bagian belakang halaman */

.page-back {
    transform: rotateY(180deg);
}

/* =========================
   COVER
========================= */

.cover {
    position: absolute;
    inset: 0;

    background: white;

    display: flex;
    justify-content: center;
    align-items: center;

    overflow: hidden;

    box-shadow:
        0 15px 40px rgba(0,0,0,.2);

    z-index: 100;
}

.cover img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.cover.hidden {
    pointer-events: none;
}

/* =========================
   CONTROLS
========================= */

.controls {
    position: fixed;
    bottom: 25px;
    left: 50%;
    transform: translateX(-50%);

    display: flex;
    gap: 12px;

    z-index: 999;
}

button {
    border: none;

    padding: 11px 18px;

    border-radius: 30px;

    background: rgba(255,255,255,.9);

    color: #594d54;

    font-size: 14px;

    cursor: pointer;

    box-shadow:
        0 5px 15px rgba(0,0,0,.1);

    transition: .2s;
}

button:hover {
    transform: translateY(-2px);
    background: white;
}

/* =========================
   PAGE NUMBER
========================= */

.page-number {
    position: fixed;
    top: 20px;
    left: 50%;

    transform: translateX(-50%);

    font-size: 13px;

    color: #71656c;

    z-index: 999;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 700px) {

    .book {
        width: 94vw;
        aspect-ratio: 0.72 / 1;
    }

    .page {
        width: 100%;
        right: 0;
    }

    .controls {
        bottom: 15px;
    }

    button {
        padding: 9px 14px;
        font-size: 12px;
    }
}
</style>
</head>


<body>

<div class="page-number">
    <span id="pageNumber">Cover</span>
</div>


<div class="book" id="book">

    <!-- COVER -->

    <div class="cover" id="cover">
        <img src="pages/cover.png" alt="Cover">
    </div>


    <!-- PAGE 1 -->

    <div class="page" data-page="1">

        <div class="page-face">
            <img src="pages/page1.png">
        </div>

        <div class="page-face page-back">
            <img src="pages/page2.png">
        </div>

    </div>


    <!-- PAGE 2 -->

    <div class="page" data-page="2">

        <div class="page-face">
            <img src="pages/page3.png">
        </div>

        <div class="page-face page-back">
            <img src="pages/page4.png">
        </div>

    </div>


    <!-- PAGE 3 -->

    <div class="page" data-page="3">

        <div class="page-face">
            <img src="pages/page5.png">
        </div>

        <div class="page-face page-back">
            <img src="pages/page6.png">
        </div>

    </div>

</div>


<!-- CONTROLS -->

<div class="controls">

    <button onclick="previousPage()">
        ← Sebelumnya
    </button>

    <button onclick="nextPage()">
        Selanjutnya →
    </button>

</div>


<script>

const pages = document.querySelectorAll(".page");

const cover = document.getElementById("cover");

const pageNumber =
    document.getElementById("pageNumber");

let currentPage = 0;


/* =========================
   NEXT PAGE
========================= */

function nextPage() {

    if (currentPage < pages.length) {

        pages[currentPage].classList.add("flipped");

        currentPage++;

        updatePage();

    }
}


/* =========================
   PREVIOUS PAGE
========================= */

function previousPage() {

    if (currentPage > 0) {

        currentPage--;

        pages[currentPage].classList.remove("flipped");

        updatePage();

    }

}


/* =========================
   UPDATE
========================= */

function updatePage() {

    if (currentPage === 0) {

        pageNumber.textContent = "Cover";

    } else {

        pageNumber.textContent =
            "Halaman " + currentPage;

    }

}


/* =========================
   COVER CLICK
========================= */

cover.addEventListener("click", () => {

    cover.style.transform =
        "rotateY(-180deg)";

    cover.style.transformOrigin =
        "left center";

    cover.style.transition =
        "transform 1.1s cubic-bezier(.65,.05,.36,1)";

    setTimeout(() => {

        cover.style.display = "none";

    }, 1100);

    currentPage = 0;

    pageNumber.textContent = "Halaman 1";

});


/* =========================
   KEYBOARD
========================= */

document.addEventListener("keydown", (event) => {

    if (event.key === "ArrowRight") {

        nextPage();

    }

    if (event.key === "ArrowLeft") {

        previousPage();

    }

});

</script>

</body>
</html>
