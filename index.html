<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Gift Studio V3</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:#f8f3fa;color:#493d4d}
button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}
.app{height:100vh;display:grid;grid-template-columns:260px 1fr 300px;overflow:hidden}
.sidebar,.right{background:#fff;border:1px solid #eadfeb;padding:18px;overflow:auto}
.sidebar{border-width:0 1px 0 0}.right{border-width:0 0 0 1px}
.brand{font-weight:800;font-size:20px;margin-bottom:18px}.brand span{color:#a36eb8}
.section{margin:20px 0 8px;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:#9a8b9e}
.btn{width:100%;padding:11px 13px;border-radius:12px;background:#f3eaf6;color:#684d72;text-align:left;margin:5px 0}
.btn.primary{background:#9d70b1;color:white;text-align:center}.btn.small{width:auto;padding:8px 10px;display:inline-block}
.toolgrid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.toolgrid .btn{margin:0}
.workspace{position:relative;display:flex;flex-direction:column;min-width:0}
.topbar{height:62px;background:#fff;border-bottom:1px solid #eadfeb;display:flex;align-items:center;justify-content:space-between;padding:0 18px;gap:10px}
.actions{display:flex;gap:8px}.actions button{padding:9px 13px;border-radius:10px;background:#f3eaf6;color:#63486d}.actions .publish{background:#9d70b1;color:#fff}
.stage-wrap{flex:1;display:flex;justify-content:center;align-items:center;overflow:auto;padding:28px}
.phone{width:360px;height:640px;background:#fff;border:7px solid #2e2730;border-radius:34px;box-shadow:0 20px 50px #5a466022;position:relative;overflow:hidden}
.canvas{width:100%;height:100%;position:relative;overflow:hidden;background:linear-gradient(145deg,#fff7fb,#f4eafa)}
.element{position:absolute;user-select:none;touch-action:none;cursor:move;transform-origin:center center}
.element.selected{outline:2px solid #a46fb7;outline-offset:3px}
.text-el{padding:5px 8px;white-space:pre-wrap;min-width:30px}.sticker{font-size:45px;line-height:1}
.photo{overflow:hidden;border-radius:14px}.photo img{width:100%;height:100%;object-fit:cover;display:block}
.letter{background:#fffdf8;padding:18px;border-radius:12px;box-shadow:0 5px 20px #76506b18;white-space:pre-wrap}
.handle{position:absolute;width:12px;height:12px;background:#fff;border:2px solid #9d70b1;border-radius:50%;right:-7px;bottom:-7px;cursor:nwse-resize}
.right h3{margin:3px 0 15px}.prop{margin:11px 0}.prop label{display:block;font-size:12px;font-weight:700;margin-bottom:5px;color:#806f84}
.prop input,.prop select,.prop textarea{width:100%;border:1px solid #dfd3e2;border-radius:9px;padding:9px;background:#fff}.prop textarea{min-height:90px;resize:vertical}
.row{display:flex;gap:7px}.row>*{flex:1}.empty{font-size:13px;color:#998e9d;line-height:1.5}
.modal{position:fixed;inset:0;background:#281d2b99;display:none;align-items:center;justify-content:center;z-index:20}.modal.show{display:flex}
.modalbox{width:min(700px,92vw);max-height:85vh;overflow:auto;background:#fff;border-radius:20px;padding:20px}
.template-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.tpl{padding:15px;border-radius:14px;background:#f7f1f8;text-align:left;min-height:100px}.tpl b{display:block;margin-bottom:8px}.tpl span{font-size:12px;color:#88778d}
.receiver{position:fixed;inset:0;background:#eee6ef;display:none;align-items:center;justify-content:center;z-index:50}.receiver.show{display:flex}.receiver .phone{width:360px;height:min(720px,94vh)}
.receiver .canvas{overflow:auto}.closeR{position:fixed;top:18px;right:18px;padding:10px 14px;border-radius:10px;background:#fff}
.game{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center}.game button{padding:12px 18px;border-radius:12px;background:#9d70b1;color:#fff;margin:5px}.game .target{font-size:55px;cursor:pointer}
@media(max-width:900px){.app{grid-template-columns:190px 1fr}.right{display:none}.sidebar{padding:12px}.stage-wrap{padding:12px}.topbar{padding:0 10px}.phone{transform:scale(.88)}}
@media(max-width:600px){.app{grid-template-columns:1fr}.sidebar{display:none}.phone{transform:none;width:min(360px,92vw);height:min(640px,88vh)}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="brand">Gift<span>Studio</span> <small>V3</small></div>
  <button class="btn primary" onclick="newGift()">＋ New Gift</button>
  <div class="section">Tambah elemen</div>
  <div class="toolgrid">
    <button class="btn" onclick="addText()">Aa Text</button>
    <button class="btn" onclick="addSticker()">♡ Sticker</button>
    <button class="btn" onclick="addPhoto()">▧ Photo</button>
    <button class="btn" onclick="addLetter()">✉ Letter</button>
    <button class="btn" onclick="addGame()">🎮 Game</button>
    <button class="btn" onclick="addButton()">↗ Link</button>
  </div>
  <div class="section">Halaman</div>
  <button class="btn" onclick="addPage()">＋ Tambah halaman</button>
  <button class="btn" onclick="duplicatePage()">⧉ Duplikat halaman</button>
  <button class="btn" onclick="deletePage()">⌫ Hapus halaman</button>
  <div class="section">Template</div>
  <button class="btn" onclick="openTemplates('letter')">✉ Letter templates</button>
  <button class="btn" onclick="openTemplates('photo')">▧ Photo templates</button>
  <button class="btn" onclick="openTemplates('game')">🎮 Games</button>
  <div class="section">File</div>
  <button class="btn" onclick="exportGift()">⇩ Export JSON</button>
  <label class="btn" style="display:block">⇧ Import JSON<input type="file" accept=".json" hidden onchange="importGift(this.files[0])"></label>
</aside>

<main class="workspace">
  <div class="topbar">
    <div><b id="pageName">Page 1</b> <span id="saveState" style="font-size:12px;color:#9b8d9f">• saved</span></div>
    <div class="actions">
      <button onclick="undo()">↶</button><button onclick="redo()">↷</button>
      <button onclick="previewGift()">Preview</button><button class="publish" onclick="publish()">Publish</button>
    </div>
  </div>
  <div class="stage-wrap"><div class="phone"><div id="canvas" class="canvas"></div></div></div>
</main>

<aside class="right">
  <h3>Inspector</h3>
  <div id="inspector"><div class="empty">Pilih text, sticker, foto, letter, atau elemen lain di canvas untuk mengeditnya.</div></div>
  <div class="section">Gift settings</div>
  <div class="prop"><label>Nama gift</label><input id="giftTitle" value="A Little Gift" oninput="gift.title=this.value;save()"></div>
  <div class="prop"><label>Background</label><input id="bg" type="color" value="#fff7fb" oninput="gift.pages[gift.page].background=this.value;render()"></div>
</aside>
</div>

<div id="modal" class="modal"><div class="modalbox"><div style="display:flex;justify-content:space-between;align-items:center"><h2 id="modalTitle">Templates</h2><button onclick="closeModal()">✕</button></div><div id="templateGrid" class="template-grid"></div></div></div>

<div id="receiver" class="receiver">
 <button class="closeR" onclick="closeReceiver()">✕ Close</button>
 <div class="phone"><div id="receiverCanvas" class="canvas"></div></div>
</div>

<script>
const KEY='giftstudio-v3';
let gift, selected=null, history=[], future=[], drag=null;

const uid=()=>Math.random().toString(36).slice(2,9);
function baseGift(){return {version:3,title:'A Little Gift',theme:'#fff7fb',page:0,pages:[{name:'Page 1',background:'#fff7fb',elements:[
 {id:uid(),type:'text',x:55,y:75,w:250,h:70,rotation:0,style:{fontSize:30,fontWeight:800,color:'#63496b',textAlign:'center'},content:'Ada sesuatu\\nbuat kamu ♡'}
]}]};}
function load(){try{gift=JSON.parse(localStorage.getItem(KEY))||baseGift()}catch(e){gift=baseGift()}render()}
function snapshot(){history.push(JSON.stringify(gift));if(history.length>50)history.shift();future=[]}
function save(){localStorage.setItem(KEY,JSON.stringify(gift));document.getElementById('saveState').textContent='• saved'}
function commit(){snapshot();save();render()}
function current(){return gift.pages[gift.page]}
function newGift(){if(confirm('Buat gift baru?')){gift=baseGift();history=[];future=[];save();render()}}
function render(){
 const p=current(), c=document.getElementById('canvas');c.innerHTML='';c.style.background=p.background||gift.theme;
 document.getElementById('pageName').textContent=p.name;
 document.getElementById('giftTitle').value=gift.title;
 document.getElementById('bg').value=p.background||'#fff7fb';
 p.elements.forEach(e=>renderElement(e,c,false));
 renderInspector();
}
function renderElement(e,c,receiver){
 const d=document.createElement('div');d.className='element '+e.type+'-el';d.dataset.id=e.id;
 d.style.left=e.x+'px';d.style.top=e.y+'px';d.style.width=e.w+'px';d.style.height=e.h+'px';d.style.transform=`rotate(${e.rotation||0}deg)`;
 if(e.type==='text'){d.textContent=e.content;Object.assign(d.style,{fontSize:e.style.fontSize+'px',fontWeight:e.style.fontWeight,color:e.style.color,textAlign:e.style.textAlign})}
 if(e.type==='sticker'){d.textContent=e.content;d.style.fontSize=e.style.fontSize+'px'}
 if(e.type==='photo'){d.innerHTML=e.src?`<img src="${e.src}">`:'<div style="display:grid;place-items:center;height:100%;background:#eadbea;color:#806d84">📷<br>Photo</div>'}
 if(e.type==='letter'){d.textContent=e.content;d.style.fontSize=e.style.fontSize+'px';d.style.color=e.style.color}
 if(e.type==='button'){d.textContent=e.content;d.style.background=e.style.background;d.style.color='#fff';d.style.padding='12px';d.style.borderRadius='12px';d.style.textAlign='center'}
 if(e.type==='game'){renderGame(d,e,receiver)}
 if(!receiver){
   if(selected===e.id)d.classList.add('selected');
   const h=document.createElement('i');h.className='handle';d.appendChild(h);
   d.addEventListener('pointerdown',ev=>startDrag(ev,e,d,false));
   h.addEventListener('pointerdown',ev=>startResize(ev,e,d));
 }
 c.appendChild(d);
}
function renderGame(d,e,receiver){
 d.innerHTML='';
 const g=document.createElement('div');g.className='game';
 const title=document.createElement('h2');title.textContent=e.config.title||'Game';
 const desc=document.createElement('p');desc.textContent=e.config.desc||'Mainkan sebentar ♡';
 const btn=document.createElement('button');btn.textContent=e.config.button||'Mulai';
 g.append(title,desc,btn);d.appendChild(g);
 if(receiver)btn.onclick=()=>playGame(g,e);
}
function playGame(g,e){
 if(e.config.kind==='balloon'){g.innerHTML='<h2>🎈 Pecahin Balon!</h2><div class="target">🎈</div><p>Tap balonnya!</p>';g.querySelector('.target').onclick=()=>{g.innerHTML='<h2>Yeay! 🎉</h2><p>Kamu berhasil!</p>'}}
 else if(e.config.kind==='memory'){g.innerHTML='<h2>🧠 Memory</h2><p>Cari pasangan yang sama</p><button>♡</button><button>♡</button><button>♡</button>'}
 else if(e.config.kind==='spin'){g.innerHTML='<h2>🎡 Spin</h2><button>SPIN</button><p id="result"></p>';g.querySelector('button').onclick=()=>g.querySelector('#result').textContent=['Peluk virtual 🤍','Kamu lucu ♡','Buka surat berikutnya ✉','Aku sayang kamu'][Math.floor(Math.random()*4)]}
 else {g.innerHTML='<h2>'+e.config.title+'</h2><p>'+e.config.desc+'</p><button>Done ♡</button>'}
}
function startDrag(ev,e,d,receiver){
 if(ev.target.classList.contains('handle'))return;
 ev.preventDefault();selected=e.id;if(!receiver)renderInspector();
 const c=document.getElementById('canvas').getBoundingClientRect();
 drag={e,d,sx:ev.clientX,sy:ev.clientY,ox:e.x,oy:e.y};
 d.setPointerCapture(ev.pointerId);
 d.onpointermove=moveDrag;d.onpointerup=endDrag;
}
function moveDrag(ev){if(!drag)return;drag.e.x=Math.max(0,Math.min(360-drag.e.w,drag.ox+ev.clientX-drag.sx));drag.e.y=Math.max(0,Math.min(640-drag.e.h,drag.oy+ev.clientY-drag.sy));drag.d.style.left=drag.e.x+'px';drag.d.style.top=drag.e.y+'px'}
function endDrag(){if(!drag)return;drag.d.onpointermove=null;drag.d.onpointerup=null;drag=null;save();render()}
function startResize(ev,e,d){ev.stopPropagation();ev.preventDefault();const sx=ev.clientX,sy=ev.clientY,ow=e.w,oh=e.h;const mv=x=>{e.w=Math.max(30,ow+x.clientX-sx);e.h=Math.max(25,oh+x.clientY-sy);d.style.width=e.w+'px';d.style.height=e.h+'px'};const up=()=>{document.removeEventListener('pointermove',mv);document.removeEventListener('pointerup',up);save();render()};document.addEventListener('pointermove',mv);document.addEventListener('pointerup',up)}
function selectedEl(){return current().elements.find(e=>e.id===selected)}
function renderInspector(){
 const box=document.getElementById('inspector'),e=selectedEl();if(!e){box.innerHTML='<div class="empty">Pilih elemen di canvas untuk mengedit.</div>';return}
 let html=`<div class="prop"><label>Type</label><input value="${e.type}" disabled></div>
 <div class="row"><div class="prop"><label>X</label><input type="number" value="${e.x}" oninput="changePos('x',this.value)"></div><div class="prop"><label>Y</label><input type="number" value="${e.y}" oninput="changePos('y',this.value)"></div></div>
 <div class="row"><div class="prop"><label>Width</label><input type="number" value="${e.w}" oninput="changePos('w',this.value)"></div><div class="prop"><label>Height</label><input type="number" value="${e.h}" oninput="changePos('h',this.value)"></div></div>`;
 if(e.type==='text'||e.type==='letter')html+=`<div class="prop"><label>Text</label><textarea oninput="changeContent(this.value)">${e.content}</textarea></div>`;
 if(e.type==='text'||e.type==='letter')html+=`<div class="row"><div class="prop"><label>Font size</label><input type="number" value="${e.style.fontSize}" oninput="changeStyle('fontSize',this.value)"></div><div class="prop"><label>Color</label><input type="color" value="${e.style.color}" oninput="changeStyle('color',this.value)"></div></div>`;
 if(e.type==='sticker')html+=`<div class="prop"><label>Sticker</label><input value="${e.content}" oninput="changeContent(this.value)"></div><div class="prop"><label>Size</label><input type="number" value="${e.style.fontSize}" oninput="changeStyle('fontSize',this.value)"></div>`;
 if(e.type==='photo')html+=`<div class="prop"><label>Image URL</label><input value="${e.src||''}" placeholder="https://..." oninput="changeSrc(this.value)"><label class="btn small" style="margin-top:6px">Upload<input type="file" accept="image/*" hidden onchange="uploadImage(this.files[0])"></label></div>`;
 html+=`<div class="row"><button class="btn small" onclick="moveLayer(-1)">↓ Back</button><button class="btn small" onclick="moveLayer(1)">↑ Front</button></div><button class="btn" onclick="duplicateElement()">⧉ Duplicate</button><button class="btn" onclick="deleteElement()">🗑 Delete</button>`;
 box.innerHTML=html;
}
function changePos(k,v){const e=selectedEl();e[k]=+v;save();render();selected=e.id}
function changeContent(v){const e=selectedEl();e.content=v;save();render();selected=e.id}
function changeStyle(k,v){const e=selectedEl();e.style[k]=k==='fontSize'?+v:v;save();render();selected=e.id}
function changeSrc(v){const e=selectedEl();e.src=v;save();render();selected=e.id}
function addElement(e){snapshot();current().elements.push(e);selected=e.id;save();render()}
function addText(){addElement({id:uid(),type:'text',x:50,y:180,w:260,h:70,rotation:0,style:{fontSize:26,fontWeight:700,color:'#63496b',textAlign:'center'},content:'Tulis sesuatu di sini ♡'})}
function addSticker(){addElement({id:uid(),type:'sticker',x:130,y:260,w:70,h:70,rotation:0,style:{fontSize:55},content:'♡'})}
function addPhoto(){addElement({id:uid(),type:'photo',x:55,y:280,w:250,h:180,rotation:0,src:'',style:{}})}
function addLetter(){addElement({id:uid(),type:'letter',x:35,y:180,w:290,h:210,rotation:0,style:{fontSize:16,color:'#57495a'},content:'Dear you,\\n\\nTulis suratmu di sini...\\n\\n— with love ♡'})}
function addButton(){addElement({id:uid(),type:'button',x:90,y:500,w:180,h:55,rotation:0,style:{background:'#9d70b1'},content:'Buka ♡'})}
function addGame(kind='balloon'){const configs={balloon:['🎈 Pecahin Balon','Tap balon sebanyak mungkin!','Mulai','balloon'],memory:['🧠 Memory Card','Cari pasangan kartu.','Mulai','memory'],spin:['🎡 Spin the Wheel','Putar dan lihat pesannya.','SPIN','spin'],guess:['🎵 Tebak Lagu','Tebak lagu dari clue.','Mulai','guess'],heart:['💗 Tangkap Hati','Tangkap hati yang muncul.','Mulai','heart'],star:['🌟 Catch the Star','Tangkap bintang!','Mulai','star']};const c=configs[kind]||configs.balloon;addElement({id:uid(),type:'game',x:20,y:130,w:320,h:360,rotation:0,style:{},config:{title:c[0],desc:c[1],button:c[2],kind:c[3]}})}
function addPage(){snapshot();gift.pages.push({name:'Page '+(gift.pages.length+1),background:'#fff7fb',elements:[]});gift.page=gift.pages.length-1;save();render()}
function duplicatePage(){snapshot();const p=JSON.parse(JSON.stringify(current()));p.name='Page '+(gift.pages.length+1);p.elements.forEach(e=>e.id=uid());gift.pages.push(p);gift.page=gift.pages.length-1;save();render()}
function deletePage(){if(gift.pages.length<2)return alert('Minimal 1 halaman.');snapshot();gift.pages.splice(gift.page,1);gift.page=Math.max(0,gift.page-1);save();render()}
function deleteElement(){if(!selected)return;snapshot();current().elements=current().elements.filter(e=>e.id!==selected);selected=null;save();render()}
function duplicateElement(){const e=selectedEl();if(!e)return;snapshot();const n=JSON.parse(JSON.stringify(e));n.id=uid();n.x=Math.min(330,n.x+15);n.y=Math.min(610,n.y+15);current().elements.push(n);selected=n.id;save();render()}
function moveLayer(dir){const p=current(),i=p.elements.findIndex(e=>e.id===selected);if(i<0)return;const j=i+dir;if(j<0||j>=p.elements.length)return;snapshot();[p.elements[i],p.elements[j]]=[p.elements[j],p.elements[i]];save();render()}
function undo(){if(!history.length)return;future.push(JSON.stringify(gift));gift=JSON.parse(history.pop());selected=null;save();render()}
function redo(){if(!future.length)return;history.push(JSON.stringify(gift));gift=JSON.parse(future.pop());selected=null;save();render()}
function previewGift(){openReceiver(false)}
function openReceiver(all=true){const rc=document.getElementById('receiverCanvas');rc.innerHTML='';rc.style.background=current().background;current().elements.forEach(e=>renderElement(e,rc,true));document.getElementById('receiver').classList.add('show')}
function closeReceiver(){document.getElementById('receiver').classList.remove('show')}
function publish(){
 const id=uid()+uid().slice(0,2);const payload=btoa(unescape(encodeURIComponent(JSON.stringify(gift))));
 const url=location.href.split('#')[0]+'#gift='+id+'.'+payload;
 prompt('Link gift (demo lokal — untuk link pendek permanen perlu backend):',url);
}
function exportGift(){const blob=new Blob([JSON.stringify(gift,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=(gift.title||'gift')+'.json';a.click()}
function importGift(file){if(!file)return;const r=new FileReader();r.onload=()=>{try{snapshot();gift=JSON.parse(r.result);gift.page=0;save();render()}catch(e){alert('JSON tidak valid')}};r.readAsText(file)}
function uploadImage(file){if(!file)return;const r=new FileReader();r.onload=()=>{changeSrc(r.result)};r.readAsDataURL(file)}
const letters=[
['Soft Letter','Kertas lembut dengan tipografi sederhana.'],['Midnight Letter','Nuansa gelap dan elegan.'],['Polaroid Note','Surat seperti catatan di foto.'],['Scrapbook','Potongan kertas ala scrapbook.'],['Tiny Note','Surat pendek minimalis.'],['Warm Paper','Kertas hangat seperti surat lama.'],['Pink Diary','Gaya diary pink.'],['Vintage Post','Kartu pos vintage.'],['Cloud Letter','Surat dengan nuansa dreamy.'],['Lavender','Ungu lembut aesthetic.'],['Coffee Note','Nuansa coffee shop.'],['Film Letter','Gaya film camera.']
];
const photos=['Polaroid','Film Strip','Scrapbook','Heart Frame','Photo Booth','Ticket','Collage 2','Collage 3','Newspaper','Postcard','Tape Photo','Memory Grid'];
const games=['balloon','memory','spin','guess','heart','star'];
function openTemplates(type){const m=document.getElementById('modal'),g=document.getElementById('templateGrid');g.innerHTML='';document.getElementById('modalTitle').textContent=type==='letter'?'Letter Templates':type==='photo'?'Photo Templates':'Games';
 if(type==='letter')letters.forEach((x,i)=>{const b=document.createElement('button');b.className='tpl';b.innerHTML='<b>✉ '+x[0]+'</b><span>'+x[1]+'</span>';b.onclick=()=>{addLetter();closeModal()};g.appendChild(b)});
 if(type==='photo')photos.forEach((x,i)=>{const b=document.createElement('button');b.className='tpl';b.innerHTML='<b>▧ '+x+'</b><span>Layout foto editable</span>';b.onclick=()=>{addPhoto();closeModal()};g.appendChild(b)});
 if(type==='game')games.forEach(k=>{const names={balloon:'🎈 Pecahin Balon',memory:'🧠 Memory Card',spin:'🎡 Spin Wheel',guess:'🎵 Tebak Lagu',heart:'💗 Tangkap Hati',star:'🌟 Catch Star'};const b=document.createElement('button');b.className='tpl';b.innerHTML='<b>'+names[k]+'</b><span>Game interaktif</span>';b.onclick=()=>{addGame(k);closeModal()};g.appendChild(b)});
 m.classList.add('show')}
function closeModal(){document.getElementById('modal').classList.remove('show')}
document.addEventListener('keydown',e=>{if(!selected)return;const el=selectedEl();if(!el)return;let moved=false;if(e.key==='ArrowLeft'){el.x--;moved=true}if(e.key==='ArrowRight'){el.x++;moved=true}if(e.key==='ArrowUp'){el.y--;moved=true}if(e.key==='ArrowDown'){el.y++;moved=true}if(moved){e.preventDefault();save();render();selected=el.id}});
load();
</script>
</body>
</html>
