<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Little Message ♡</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap');

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    width: 100%;
    height: 100vh;
    overflow: hidden;
    font-family: "Quicksand", sans-serif;
    background: #dff3e6;
}

/* =========================
   VIDEO FRAME
========================= */

.scene {
    position: relative;
    width: 100%;
    height: 100vh;
    overflow: hidden;
    background:
        linear-gradient(
            to bottom,
            #bde8f5 0%,
            #d9f4ee 48%,
            #a8d99d 49%,
            #80c477 100%
        );
}

/* matahari */

.sun {
    position: absolute;
    width: 120px;
    height: 120px;
    border-radius: 50%;
    background: #ffe9a8;
    top: 9%;
    right: 13%;
    box-shadow: 0 0 50px #ffe8a5;
}

/* awan */

.cloud {
    position: absolute;
    width: 130px;
    height: 45px;
    background: rgba(255,255,255,.72);
    border-radius: 50px;
    filter: blur(.3px);
}

.cloud::before,
.cloud::after {
    content: "";
    position: absolute;
    background: inherit;
    border-radius: 50%;
}

.cloud::before {
    width: 55px;
    height: 55px;
    left: 20px;
    bottom: 12px;
}

.cloud::after {
    width: 70px;
    height: 70px;
    right: 15px;
    bottom: 8px;
}

.cloud.one {
    top: 16%;
    left: 7%;
    animation: cloudMove 15s linear infinite;
}

.cloud.two {
    top: 27%;
    right: -30px;
    transform: scale(.7);
    animation: cloudMove2 18s linear infinite;
}

@keyframes cloudMove {
    from { transform: translateX(-30px); }
    to { transform: translateX(80px); }
}

@keyframes cloudMove2 {
    from { transform: translateX(0); }
    to { transform: translateX(-180px); }
}

/* =========================
   BACKGROUND
========================= */

.hill {
    position: absolute;
    bottom: 29%;
    width: 80%;
    height: 28%;
    background: #9bd28d;
    border-radius: 50% 50% 0 0;
}

.hill.left {
    left: -25%;
}

.hill.right {
    right: -25%;
    background: #8bc87e;
}

.ground {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 35%;
    background: #83c775;
}

/* jalan */

.path {
    position: absolute;
    bottom: -12%;
    left: 30%;
    width: 40%;
    height: 50%;
    background: #d9c7a0;
    transform: perspective(300px) rotateX(35deg);
    border-radius: 50% 50% 0 0;
    opacity: .8;
}

/* bunga */

.flower {
    position: absolute;
    bottom: 18%;
    font-size: 25px;
    animation: flowerMove 3s ease-in-out infinite;
}

.flower:nth-child(1) { left: 8%; }
.flower:nth-child(2) { left: 17%; animation-delay: .5s; }
.flower:nth-child(3) { right: 12%; animation-delay: 1s; }
.flower:nth-child(4) { right: 22%; animation-delay: 1.5s; }

@keyframes flowerMove {
    50% { transform: translateY(-5px) rotate(3deg); }
}

/* =========================
   BUNNY
========================= */

.bunny {
    position: absolute;
    bottom: 17%;
    left: 13%;
    width: 90px;
    height: 80px;
    animation: bunnyJump 2.2s ease-in-out infinite;
    z-index: 5;
}

.bunny-body {
    position: absolute;
    bottom: 0;
    left: 15px;
    width: 62px;
    height: 48px;
    background: white;
    border-radius: 50%;
    box-shadow: 0 5px 0 rgba(0,0,0,.04);
}

.bunny-head {
    position: absolute;
    left: 28px;
    top: 5px;
    width: 52px;
    height: 48px;
    background: white;
    border-radius: 50%;
}

.ear {
    position: absolute;
    width: 17px;
    height: 48px;
    background: white;
    border-radius: 50%;
    top: -31px;
}

.ear.left {
    left: 4px;
    transform: rotate(-10deg);
}

.ear.right {
    right: 4px;
    transform: rotate(10deg);
}

.eye {
    position: absolute;
    width: 5px;
    height: 7px;
    background: #594d4d;
    border-radius: 50%;
    top: 20px;
}

.eye.left { left: 15px; }
.eye.right { right: 15px; }

.nose {
    position: absolute;
    width: 5px;
    height: 5px;
    background: #e89aa4;
    border-radius: 50%;
    left: 24px;
    top: 28px;
}

.tail {
    position: absolute;
    width: 22px;
    height: 22px;
    background: white;
    border-radius: 50%;
    right: 0;
    bottom: 20px;
}

@keyframes bunnyJump {
    0%,100% {
        transform: translateY(0);
    }
    45% {
        transform: translateY(-28px);
    }
}

/* =========================
   CHARACTERS
========================= */

.characters {
    position: absolute;
    bottom: 13%;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: flex-end;
    gap: 20px;
    z-index: 10;
    opacity: 0;
    transition: opacity 1s ease;
}

.characters.show {
    opacity: 1;
}

.person {
    position: relative;
    width: 95px;
    height: 180px;
}

.head {
    position: absolute;
    top: 0;
    left: 20px;
    width: 58px;
    height: 62px;
    background: #ffd9c2;
    border-radius: 48% 48% 45% 45%;
    z-index: 3;
}

/* rambut */

.girl .hair {
    position: absolute;
    width: 70px;
    height: 82px;
    left: 14px;
    top: -9px;
    background: #493936;
    border-radius: 50% 50% 40% 40%;
    z-index: 2;
}

.boy .hair {
    position: absolute;
    width: 63px;
    height: 55px;
    left: 18px;
    top: -5px;
    background: #4a403d;
    border-radius: 55% 55% 35% 35%;
    z-index: 4;
}

.eye-person {
    position: absolute;
    top: 29px;
    width: 6px;
    height: 8px;
    background: #4d4140;
    border-radius: 50%;
    z-index: 5;
}

.eye-person.left { left: 17px; }
.eye-person.right { right: 17px; }

.mouth {
    position: absolute;
    top: 42px;
    left: 27px;
    width: 8px;
    height: 5px;
    border-bottom: 2px solid #b96c75;
    border-radius: 50%;
    z-index: 5;
}

.body-person {
    position: absolute;
    top: 57px;
    left: 13px;
    width: 70px;
    height: 100px;
    border-radius: 25px 25px 12px 12px;
}

.girl .body-person {
    background: #f4b9c5;
}

.boy .body-person {
    background: #9ec5e8;
}

.arm {
    position: absolute;
    width: 18px;
    height: 75px;
    background: #ffd9c2;
    border-radius: 20px;
    top: 67px;
    z-index: 1;
}

.girl .arm.left {
    left: 3px;
    transform: rotate(12deg);
}

.girl .arm.right {
    right: 3px;
    transform: rotate(-12deg);
}

.boy .arm.left {
    left: 3px;
    transform: rotate(12deg);
}

.boy .arm.right {
    right: 3px;
    transform: rotate(-12deg);
}

/* kaki */

.leg {
    position: absolute;
    width: 23px;
    height: 48px;
    background: #6f6a72;
    bottom: -10px;
    border-radius: 0 0 15px 15px;
}

.leg.left { left: 27px; }
.leg.right { right: 27px; }

/* =========================
   BUBBLE
========================= */

.bubble {
    position: absolute;
    top: 13%;
    left: 50%;
    transform: translateX(-50%) scale(.85);
    min-width: 280px;
    max-width: 470px;
    padding: 20px 28px;
    background: rgba(255,255,255,.92);
    border-radius: 30px;
    text-align: center;
    color: #65575a;
    font-size: clamp(16px, 2vw, 23px);
    font-weight: 600;
    line-height: 1.5;
    box-shadow: 0 10px 30px rgba(82,72,70,.13);
    opacity: 0;
    z-index: 20;
    transition:
        opacity .7s ease,
        transform .7s ease;
}

.bubble::after {
    content: "";
    position: absolute;
    bottom: -13px;
    left: 50%;
    transform: translateX(-50%);
    border-left: 15px solid transparent;
    border-right: 15px solid transparent;
    border-top: 17px solid rgba(255,255,255,.92);
}

.bubble.show {
    opacity: 1;
    transform: translateX(-50%) scale(1);
}

/* =========================
   TITLE
========================= */

.title {
    position: absolute;
    top: 9%;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    z-index: 15;
    color: #66595a;
    transition: opacity 1s ease;
}

.title h1 {
    font-size: clamp(30px, 5vw, 58px);
    font-weight: 700;
}

.title p {
    margin-top: 7px;
    font-size: 15px;
    opacity: .7;
}

/* =========================
   HUG
========================= */

.characters.hug {
    gap: 0;
}

.characters.hug .girl {
    transform: translateX(17px);
}

.characters.hug .boy {
    transform: translateX(-17px);
}

.characters.hug .girl .arm.right {
    transform: rotate(-65deg);
    transform-origin: top;
}

.characters.hug .boy .arm.left {
    transform: rotate(65deg);
    transform-origin: top;
}

/* =========================
   ENDING
========================= */

.ending {
    position: absolute;
    inset: 0;
    background: linear-gradient(
        to bottom,
        #f6c6b7,
        #f9d9b7,
        #b6d69e
    );
    z-index: 50;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    opacity: 0;
    pointer-events: none;
    transition: opacity 1.5s ease;
}

.ending.show {
    opacity: 1;
    pointer-events: auto;
}

.ending h2 {
    color: #65575a;
    font-size: clamp(27px, 5vw, 55px);
    text-align: center;
}

.ending p {
    margin-top: 12px;
    color: #756567;
    font-size: 17px;
}

.replay {
    margin-top: 35px;
    border: none;
    padding: 12px 28px;
    border-radius: 30px;
    background
