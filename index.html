  <!-- Google Fonts: Poppins -->

  <style>
    * {
      font-family: 'Poppins', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    
    body {
      background-color: #fff7fb;
      color: #5d5061;
      overflow-x: hidden;
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #fff7fb;
    }
    ::-webkit-scrollbar-thumb {
      background: #e8b5ca;
      border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #9b76a7;
    }

    @keyframes floatParticle {
      0% {
        transform: translate3d(0, 0, 0) rotate(0deg);
        opacity: 0.2;
      }
      50% {
        transform: translate3d(15px, -30px, 0) rotate(180deg);
        opacity: 0.8;
      }
      100% {
        transform: translate3d(0, -60px, 0) rotate(360deg);
        opacity: 0;
      }
    }

    .particle-item {
      position: absolute;
      pointer-events: none;
      will-change: transform, opacity;
      animation: floatParticle linear infinite;
    }

    .soft-card {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(8px);
      border: 1px solid #e8b5ca;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(155, 118, 167, 0.05);
    }
  </style>
</head>

    // ==========================================
    // PARTICLE ENGINE
    // ==========================================
    const BackgroundParticles = memo(({ config }) => {
      if (!config || !config.enabled) return null;

      const particleSymbols = {
        hearts: "💗", stars: "⭐", flowers: "🌸", petals: "🪷", bubbles: "🫧", sparkles: "✨"
      };
      const symbol = particleSymbols[config.type] || "💗";
      const count = Math.min(config.count || 10, 15);

      const items = useMemo(() => {
        return Array.from({ length: count }).map((_, i) => ({
          id: i,
          left: `${(i * (100 / count)) + Math.random() * 5}%`,
          top: `${Math.random() * 80 + 10}%`,
          duration: `${4 + (i % 3) * 2}s`,
          delay: `${(i % 4) * 0.5}s`,
          size: `${14 + (i % 4) * 4}px`
        }));
      }, [count]);

      return (
        <div className="fixed inset-0 pointer-events-none overflow-hidden z-0">
          {items.map((p) => (
            <div
              key={p.id}
              className="particle-item"
              style={{
                left: p.left,
                top: p.top,
                animationDuration: p.duration,
                animationDelay: p.delay,
                fontSize: p.size
              }}
            >
              {symbol}
            </div>
          ))}
        </div>
      );
    });

    // ==========================================
    // GAME ENGINE HOST
    // ==========================================
    function GameEngineHost({ game, onWin }) {
      const [isPlaying, setIsPlaying] = useState(false);
      const [score, setScore] = useState(0);
      const [won, setWon] = useState(false);
      const [passcode, setPasscode] = useState('');

      const target = game.config?.targetScore || 5;

      const handleTap = () => {
        const next = score + 1;
        setScore(next);
        if (next >= target) {
          setWon(true);
          if (onWin) onWin(game.id);
        }
      };

      const handleMysteryUnlock = () => {
        if (passcode === (game.config?.secretPasscode || "1234")) {
          setWon(true);
          if (onWin) onWin(game.id);
        } else {
          alert(`Kode salah! Petunjuk sandi default: ${game.config?.secretPasscode || "1234"}`);
        }
      };

      return (
        <div className="soft-card p-4 text-center max-w-sm mx-auto my-3 relative z-10">
          <div className="text-3xl mb-1">{game.emoji}</div>
          <h4 className="font-bold text-xs text-[#5d5061]">{game.title}</h4>
          <p className="text-[10px] text-gray-500 mb-3">{game.instruction}</p>

          {!isPlaying && !won && (
            <button
              onClick={() => setIsPlaying(true)}
              className="w-full py-2 bg-[#9b76a7] text-white font-bold rounded-xl text-xs active:scale-95 transition shadow-sm"
            >
              Mulai Main 🚀
            </button>
          )}

          {isPlaying && !won && (
            <div>
              {game.type === 'mystery' ? (
                <div className="space-y-2">
                  <input
                    type="text"
                    maxLength={6}
                    value={passcode}
                    onChange={(e) => setPasscode(e.target.value)}
                    placeholder="Masukkan Kode Rahasia"
                    className="w-full p-2 border border-[#e8b5ca] rounded-xl text-center text-xs"
                  />
                  <button
                    onClick={handleMysteryUnlock}
                    className="w-full py-2 bg-[#9b76a7] text-white font-bold rounded-xl text-xs"
                  >
                    Buka Kunci 🔓
                  </button>
                </div>
              ) : (
                <div className="space-y-2">
                  <div className="text-lg font-bold text-[#9b76a7]">{score} / {target}</div>
                  <button
                    onClick={handleTap}
                    className="w-full py-3 bg-[#e8b5ca] text-[#5d5061] font-bold rounded-xl text-xs active:scale-90 transition"
                  >
                    Ketuk / Tap Di Sini! 💓
                  </button>
                </div>
              )}
            </div>
          )}

          {won && (
            <div className="py-2 bg-[#fff7fb] rounded-xl border border-[#e8b5ca] animate-pulse">
              <div className="text-2xl mb-1">🎉</div>
              <p className="text-xs font-bold text-[#9b76a7]">{game.config?.winMessage || "Berhasil Diselesaikan!"}</p>
            </div>
          )}
        </div>
      );
    }

    // ==========================================
    // EDITOR DASHBOARD
    // ==========================================
    function EditorDashboard({ giftData, setGiftData, onPreview, onPublish, lastSaved, saveStatus }) {
      const [tab, setTab] = useState('cover');

      const updateCover = (field, val) => {
        setGiftData(prev => ({ ...prev, cover: { ...prev.cover, [field]: val } }));
      };

      const updateMessage = (index, field, val) => {
        setGiftData(prev => {
          const newMsgs = [...prev.messages];
          newMsgs[index] = { ...newMsgs[index], [field]: val };
          return { ...prev, messages: newMsgs };
        });
      };

      const toggleGame = (id) => {
        setGiftData(prev => ({
          ...prev,
          games: prev.games.map(g => g.id === id ? { ...g, enabled: !g.enabled } : g)
        }));
      };

      const addPhotoUrl = (catId, url) => {
        if (!url) return;
        setGiftData(prev => ({
          ...prev,
          photos: prev.photos.map(p => p.id === catId ? { ...p, items: [...p.items, { id: Date.now().toString(), url }] } : p)
        }));
      };

      return (

              <p className="text-[9px] text-gray-400">{saveStatus} • Tersimpan: {lastSaved}</p>
            </div>
            <div className="flex space-x-1.5">
              <button
                onClick={onPreview}
                className="px-3 py-1.5 bg-[#e8b5ca] text-[#5d5061] font-bold text-xs rounded-xl active:scale-95 transition"
              >
                👀 Live Preview
              </button>
              <button
                onClick={onPublish}
                className="px-3 py-1.5 bg-[#9b76a7] text-white font-bold text-xs rounded-xl shadow active:scale-95 transition"
              >
                🚀 Publish
              </button>
            </div>
          </header>

          <main className="max-w-xl mx-auto p-3 space-y-3">
            <div className="flex space-x-1.5 overflow-x-auto pb-1 scrollbar-none">
              {[
                { id: 'cover', name: 'Cover' },
                { id: 'messages', name: 'Messages' },
                { id: 'games', name: 'Games' },
                { id: 'photos', name: 'Photos' },
                { id: 'music', name: 'Music' },
                { id: 'appearance', name: 'Appearance' }
              ].map(t => (
                <button
                  key={t.id}
                  onClick={() => setTab(t.id)}
                  className={`px-3 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap transition ${
                    tab === t.id ? 'bg-[#9b76a7] text-white shadow-sm' : 'bg-white border border-[#e8b5ca] text-[#5d5061]'
                  }`}
                >
                  {t.name}
                </button>
              ))}
            </div>

            {tab === 'cover' && (
              <div className="soft-card p-4 space-y-3">
                <h3 className="font-bold text-xs text-[#9b76a7]">💌 Pengaturan Cover Depan</h3>
                <div>
                  <label className="text-[10px] text-gray-500 font-semibold">Tagline Kecil</label>
                  <input
                    type="text"
                    value={giftData.cover.tagline}
                    onChange={(e) => updateCover('tagline', e.target.value)}
                    className="w-full p-2 border border-[#e8b5ca] rounded-xl text-xs mt-0.5"
                  />
                </div>
                <div>
                  <label className="text-[10px] text-gray-500 font-semibold">Judul Utama Cover</label>
                  <input
                    type="text"
                    value={giftData.cover.title}
                    onChange={(e) => updateCover('title', e.target.value)}
                    className="w-full p-2 border border-[#e8b5ca] rounded-xl text-xs mt-0.5"

                  />

                <div>
                  <label className="text-[10px] text-gray-500 font-semibold">Teks Tombol Buka</label>
                  <input
                    type="text"
                    value={giftData.cover.buttonText}
                    onChange={(e) => updateCover('buttonText', e.target.value)}
                    className="w-full p-2 border border-[#e8b5ca] rounded-xl text-xs mt-0.5"
                  />
                </div>
              </div>
            )}

            {tab === 'messages' && (
              <div className="soft-card p-4 space-y-3">
                <h3 className="font-bold text-xs text-[#9b76a7]">📝 Edit Pesan & Surat Utama</h3>
                <div>
                  <label className="text-[10px] text-gray-500 font-semibold">Judul Surat</label>
                  <input
                    type="text"

                </div>
                <div>
                  <label className="text-[10px] text-gray-500 font-semibold">Isi Pesan Romantis</label>

            {tab === 'games' && (

                <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 max-h-[50vh] overflow-y-auto pr-1">
                  {giftData.games.map((g) => (
                    <div key={g.id} className="p-2 bg-white rounded-xl border border-[#e8b5ca] flex items-center justify-between">
                      <div className="flex items-center space-x-2">
                        <span>{g.emoji}</span>
                        <span className="text-xs font-semibold truncate max-w-[120px]">{g.title}</span>

                        }`}

            )}

            {tab === 'photos' && (
              <div className="soft-card p-4 space-y-3">

                <div className="space-y-2 max-h-[50vh] overflow-y-auto pr-1">

                        <span className="text-[10px] text-gray-400">{cat.items.length} foto</span>

                        placeholder="Tempel URL Gambar (Direct Link)..."
                        onKeyDown={(e) => {
                          if (e.key === 'Enter') {
                            addPhotoUrl(cat.id, e.target.value);
                            e.target.value = '';

                        className="w-full p-1.5 border rounded-lg text-[10px]"
                      />
                    </div>
                  ))}

              </div>

            {tab === 'music' && (
              <div className="soft-card p-4 space-y-3">
                <h3 className="font-bold text-xs text-[#9b76a7]">🎵 Audio & Background Music</h3>
                <div>
                  <label className="text-[10px] text-gray-500 font-semibold">URL Audio Direct (MP3)</label>
                  <input
                    type="text"
                    placeholder="https://domain.com/music.mp3"
                    value={giftData.musicUrl}
                    onChange={(e) => setGiftData({ ...giftData, musicUrl: e.target.value })}
                    className="w-full p-2 border border-[#e8b5ca] rounded-xl text-xs mt-0.5"
                  />
                </div>
              </div>
            )}

            {tab === 'appearance' && (
              <div className="soft-card p-4 space-y-3">
                <h3 className="font-bold text-xs text-[#9b76a7]">✨ Efek Partikel Visual</h3>
                <div>
                  <label className="text-[10px] text-gray-500 font-semibold">Jenis Partikel Melayang</label>
                  <select
                    value={giftData.theme.particles.type}
                    onChange={(e) => setGiftData({
                      ...giftData,
                      theme: { ...giftData.theme, particles: { ...giftData.theme.particles, type: e.target.value } }
                    })}
                    className="w-full p-2 border border-[#e8b5ca] rounded-xl text-xs mt-0.5 bg-white"
                  >
                    <option value="hearts">💗 Hearts</option>
                    <option value="stars">⭐ Stars</option>
                    <option value="flowers">🌸 Bunga</option>
                    <option value="sparkles">✨ Sparkles</option>
                    <option value="bubbles">🫧 Gelembung</option>
                  </select>
                </div>
              </div>
            )}
          </main>
        </div>
      );

    // ==========================================
    // RECIPIENT VIEW
    // ==========================================

      const [isOpen, setIsOpen] = useState(false);
      const [replyInput, setReplyInput] = useState('');

      const activeGames = useMemo(() => giftData.games.filter(g => g.enabled), [giftData.games]);

      return (
        <div className="min-h-screen relative pb-20 overflow-x-hidden">
          <BackgroundParticles config={giftData.theme.particles} />

          {onBackToEditor && (
            <button
              onClick={onBackToEditor}
              className="fixed top-3 left-3 z-50 bg-black/70 text-white px-3 py-1 rounded-full text-[10px] font-bold backdrop-blur"

          )}

            <div className="min-h-screen flex flex-col items-center justify-center p-6 text-center relative z-10">
              <span className="text-[10px] font-bold text-[#9b76a7] bg-white/80 px-3 py-1 rounded-full border border-[#e8b5ca] mb-2">
                {giftData.cover.tagline}
              </span>
              <h1 className="text-xl sm:text-2xl font-bold text-[#5d5061] mb-2">{giftData.cover.title}</h1>
              <p className="text-xs text-gray-600 mb-6 max-w-xs">{giftData.cover.subtitle}</p>
              <button
                onClick={() => setIsOpen(true)}
                className="px-7 py-3 bg-[#9b76a7] text-white font-bold text-xs rounded-full shadow-lg active:scale-95 transition"
              >
                {giftData.cover.buttonText}
              </button>
            </div>
          ) : (
            <main className="max-w-md mx-auto p-4 space-y-5 relative z-10 pt-8">
              {giftData.messages.map((m) => (
                <div key={m.id} className="soft-card p-4 text-center">
                  <h2 className="font-bold text-sm text-[#9b76a7] mb-2">{m.title}</h2>
                  <p className="text-xs text-[#5d5061] whitespace-pre-line leading-relaxed">{m.content}</p>
                </div>
              ))}

              {activePhotos.length > 0 && (
                <section className="space-y-3">
                  <h3 className="text-center font-bold text-xs uppercase tracking-wider text-[#9b76a7]">📸 Memory Gallery</h3>
                  {activePhotos.map(cat => (
                    <div key={cat.id} className="soft-card p-3">
                      <h4 className="font-bold text-xs mb-2 text-[#5d5061]">{cat.title}</h4>
                      <div className="grid grid-cols-2 gap-2">
                        {cat.items.map(img => (
                          <img key={img.id} src={img.url} alt="Memory" className="w-full h-28 object-cover rounded-xl shadow-sm" />
                        ))}
                      </div>
                    </div>
                  ))}
                </section>
              )}

              {activeGames.length > 0 && (
                <section className="space-y-3">
                  <h3 className="text-center font-bold text-xs uppercase tracking-wider text-[#9b76a7]">🎮 Play Mini Games</h3>
                  {activeGames.map(g => (
                    <GameEngineHost key={g.id} game={g} />
                  ))}
                </section>
              )}

              <div className="soft-card p-4 text-center space-y-2">
                <h4 className="font-bold text-xs text-[#5d5061]">💬 Kirim Balasan ke Pembuat Kado</h4>
                <input
                  type="text"
                  placeholder="Tulis balasan manismu..."
                  value={replyInput}
                  onChange={(e) => setReplyInput(e.target.value)}
                  className="w-full p-2 border border-[#e8b5ca] rounded-xl text-xs"
                />
                <button
                  onClick={() => {
                    if (replyInput) {
                      alert("Terima kasih! Balasanmu berhasil terkirim 💗");
                      setReplyInput('');
                    }
                  }}
                  className="w-full py-2 bg-[#e8b5ca] text-[#5d5061] font-bold rounded-xl text-xs"
                >
                  Kirim Balasan ✨
                </button>
              </div>
            </main>
          )}
        </div>
      );
    }

    // ==========================================
    // MAIN APP CONTROLLER (INTEGRATED WITH JSONBIN)
    // ==========================================
    function App() {
      const [giftData, setGiftData] = useState(() => {
        const saved = localStorage.getItem('kado_draft_data');
        return saved ? JSON.parse(saved) : INITIAL_GIFT_DATA;
      });

      const [viewMode, setViewMode] = useState('editor');
      const [lastSavedTime, setLastSavedTime] = useState('Baru saja');
      const [saveStatus, setSaveStatus] = useState('Tersimpan');
      const [publishedModalUrl, setPublishedModalUrl] = useState('');
      const [isLoading, setIsLoading] = useState(false);

      // AutoSave Draft Lokal
      useEffect(() => {
        setSaveStatus('Menyimpan...');
        const timer = setTimeout(() => {
          localStorage.setItem('kado_draft_data', JSON.stringify(giftData));
          setLastSavedTime(new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }));
          setSaveStatus('Draft Tersimpan');
        }, 800);
        return () => clearTimeout(timer);
      }, [giftData]);

      // Publish ke Cloud (JSONBin.io)
      const handlePublish = async () => {
        setIsLoading(true);
        const token = Math.random().toString(36).substring(2, 8);
        const publishedPayload = { ...giftData, status: 'published', updatedAt: new Date().toISOString() };

        try {
          // Ambil data yang ada di bin saat ini
          const resGet = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}/latest`, {
            headers: { "X-Master-Key": JSONBIN_MASTER_KEY }
          });
          const currentBin = await resGet.json();
          const existingData = currentBin.record || {};

          // Sisipkan kado baru menggunakan token unik
          existingData[token] = publishedPayload;

          // Update bin kembali
          await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`, {
            method: "PUT",
            headers: {
              "Content-Type": "application/json",
              "X-Master-Key": JSONBIN_MASTER_KEY
            },
            body: JSON.stringify(existingData)
          });

          const shareableUrl = `${window.location.origin}${window.location.pathname}#/g/${token}`;
          setPublishedModalUrl(shareableUrl);
        } catch (err) {
          alert("Gagal mempublikasikan kado. Periksa koneksi atau API Key kamu!");
          console.error(err);
        } finally {
          setIsLoading(false);
        }
      };

      // Baca URL Hash & Load Data dari Cloud jika penerima membuka link
      useEffect(() => {
        const loadFromCloud = async () => {
          const hash = window.location.hash;
          if (hash.includes('#/g/')) {
            const token = hash.split('#/g/')[1];
            setIsLoading(true);
            try {
              const res = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}/latest`, {
                headers: { "X-Master-Key": JSONBIN_MASTER_KEY }
              });
              const result = await res.json();
              const targetGift = result.record?.[token];

              if (targetGift) {
                setGiftData(targetGift);
                setViewMode('recipient');
              } else {
                alert("Kado tidak ditemukan atau link salah!");
              }
            } catch (err) {
              console.error("Gagal memuat kado:", err);
            } finally {
              setIsLoading(false);
            }
          }
        };

        loadFromCloud();
      }, []);

      if (isLoading) {
        return (
          <div className="min-h-screen flex items-center justify-center bg-[#fff7fb] text-[#9b76a7] font-bold text-sm">
            <div className="animate-pulse text-center">
              <div className="text-3xl mb-2">🎁</div>
              Memuat Kado Spesial...
            </div>
          </div>
        );
      }

      return (
        <div>
          {viewMode === 'editor' && (
            <EditorDashboard
              giftData={giftData}
              setGiftData={setGiftData}
              onPreview={() => setViewMode('preview')}
              onPublish={handlePublish}
              lastSaved={lastSavedTime}
              saveStatus={saveStatus}
            />
          )}

          {viewMode === 'preview' && (
            <RecipientView
              giftData={giftData}
              onBackToEditor={() => setViewMode('editor')}
            />
          )}

          {viewMode === 'recipient' && (
            <RecipientView giftData={giftData} />
          )}

          {/* Modal Berhasil Publish */}
          {publishedModalUrl && (
            <div className="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="soft-card p-5 max-w-sm w-full text-center space-y-3 bg-white">
                <div className="text-4xl">🎉</div>
                <h3 className="font-bold text-sm text-[#5d5061]">Kado Berhasil Dipublish!</h3>
                <p className="text-[10px] text-gray-500">Link ini sudah aktif & bisa dibuka dari HP mana saja:</p>
                <input
                  type="text"
                  readOnly
                  value={publishedModalUrl}
                  className="w-full p-2 bg-gray-50 border rounded-xl text-[10px] text-center font-mono select-all"
                />
                <div className="flex space-x-2 pt-1">
                  <button
                    onClick={() => {
                      navigator.clipboard.writeText(publishedModalUrl);
                      alert("Link unik berhasil disalin! 💗");
                    }}
                    className="flex-1 py-2 bg-[#e8b5ca] text-[#5d5061] text-xs font-bold rounded-xl"
                  >
                    📋 Salin Link
                  </button>
                  <button
                    onClick={() => setPublishedModalUrl('')}
                    className="flex-1 py-2 bg-[#9b76a7] text-white text-xs font-bold rounded-xl"
                  >
                    Tutup
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
