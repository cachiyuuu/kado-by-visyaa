    // --- CANVAS PARTICLE SYSTEM ---
    class ParticleEngine {
      constructor(canvasId) {
        this.canvas = document.getElementById(canvasId);
        this.ctx = this.canvas.getContext('2d');
        this.particles = [];
        this.type = 'hearts'; // hearts, sparkles, petals, snow, confetti
        this.animationFrame = null;
        this.resize();

        window.addEventListener('resize', () => this.resize());
      }

      resize() {
        this.canvas.width = window.innerWidth;
        this.canvas.height = window.innerHeight;
      }

      setEffect(type) {
        this.type = type;
        this.particles = [];
        if (type === 'none') {
          this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
          if (this.animationFrame) cancelAnimationFrame(this.animationFrame);
          return;
        }
        
        const count = window.innerWidth < 768 ? 20 : 45; // Performance limit for mobile
        for (let i = 0; i < count; i++) {
          this.particles.push(this.createParticle());
        }

        if (!this.animationFrame) {
          this.loop();
        }
      }

      createParticle() {
        return {
          x: Math.random() * this.canvas.width,
          y: Math.random() * this.canvas.height,
          size: Math.random() * 14 + 8,
          speedY: Math.random() * 1.5 + 0.5,
          speedX: Math.sin(Math.random() * Math.PI * 2) * 0.8,
          opacity: Math.random() * 0.7 + 0.3,
          rotation: Math.random() * 360,
          rotSpeed: (Math.random() - 0.5) * 2,
          char: this.getCharForType()
        };
      }

      getCharForType() {
        switch (this.type) {
          case 'hearts': return ['❤️', '💖', '💕', '🌸', '✨'][Math.floor(Math.random() * 5)];
          case 'sparkles': return ['✦', '✧', '✨', '⭐', '⋆'][Math.floor(Math.random() * 5)];
          case 'petals': return ['🌸', '🌺', '🌷', '🍃'][Math.floor(Math.random() * 4)];
          case 'snow': return ['❄️', '❅', '❆', '•'][Math.floor(Math.random() * 4)];
          default: return '❤️';
        }
      }

      loop() {
        if (this.type === 'none') return;
        this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

        this.particles.forEach((p) => {
          p.y += p.speedY;
          p.x += Math.sin(p.y * 0.01) * p.speedX;
          p.rotation += p.rotSpeed;

          if (p.y > this.canvas.height + 20) {
            p.y = -20;
            p.x = Math.random() * this.canvas.width;
          }

          this.ctx.save();
          this.ctx.translate(p.x, p.y);
          this.ctx.rotate((p.rotation * Math.PI) / 180);
          this.ctx.globalAlpha = p.opacity;
          this.ctx.font = `${p.size}px sans-serif`;
          this.ctx.textAlign = 'center';
          this.ctx.textBaseline = 'middle';
          this.ctx.fillText(p.char, 0, 0);
          this.ctx.restore();
        });

        this.animationFrame = requestAnimationFrame(() => this.loop());
      }
    }

    // --- HISTORY UNDO / REDO SYSTEM ---
    function pushHistoryState() {
      if (!STATE.currentGift) return;
      const snapshot = JSON.parse(JSON.stringify(STATE.currentGift));
      
      // Trim forward history if we are in middle of stack
      if (STATE.historyIndex < STATE.history.length - 1) {
        STATE.history = STATE.history.slice(0, STATE.historyIndex + 1);
      }

      STATE.history.push(snapshot);
      if (STATE.history.length > STATE.maxHistory) {
        STATE.history.shift();
      } else {
        STATE.historyIndex++;
      }
      triggerAutosave();
    }

    function undo() {
      if (STATE.historyIndex > 0) {
        STATE.historyIndex--;
        STATE.currentGift = JSON.parse(JSON.stringify(STATE.history[STATE.historyIndex]));
        renderApp();
        showToast('Undo performed', 'info');
      }
    }

    function redo() {
      if (STATE.historyIndex < STATE.history.length - 1) {
        STATE.historyIndex++;
        STATE.currentGift = JSON.parse(JSON.stringify(STATE.history[STATE.historyIndex]));
        renderApp();
        showToast('Redo performed', 'info');
      }
    }

    function triggerAutosave() {
      STATE.autosaveStatus = 'Saving...';
      const statusEl = document.getElementById('autosaveStatusText');
      if (statusEl) statusEl.innerText = STATE.autosaveStatus;

      clearTimeout(STATE.autosaveTimer);
      STATE.autosaveTimer = setTimeout(() => {
        if (STATE.currentGift) {
          const idx = STATE.drafts.findIndex(d => d.id === STATE.currentGift.id);
          STATE.currentGift.updatedAt = new Date().toISOString();
          if (idx >= 0) {
            STATE.drafts[idx] = STATE.currentGift;
          } else {
            STATE.drafts.push(STATE.currentGift);
          }
          saveDraftsToStorage();
        }
        STATE.autosaveStatus = 'Saved ✓';
        if (statusEl) statusEl.innerText = STATE.autosaveStatus;
      }, 1000);
    }

    function renderApp() {
      const app = document.getElementById('app');
      app.innerHTML = '';

      if (!STATE.particleInstance) {
        STATE.particleInstance = new ParticleEngine('particleCanvas');
      }

      if (STATE.currentGift && STATE.currentGift.effect) {
        STATE.particleInstance.setEffect(STATE.currentGift.effect);
      } else {
        STATE.particleInstance.setEffect('hearts');
      }

      // Check URL Hash for shared recipient links
      const hash = window.location.hash;
      if (hash.startsWith('#gift/')) {
        const giftId = hash.replace('#gift/', '');
        const pub = STATE.publishedGifts.find(g => g.id === giftId || g.shareId === giftId);

          window.location.hash = '';
          STATE.view = 'DASHBOARD';

          renderDashboardView(app);
          break;
        case 'EDITOR':
          renderEditorView(app);
          break;
        case 'PREVIEW':
          renderRecipientView(app, true);
          break;
        case 'RECIPIENT_OPENING':
          renderGiftOpeningCeremony(app);
          break;
        case 'RECIPIENT_MAIN':
          renderRecipientView(app, false);
          break;

    function openCreateGiftModal() {
      const types = ['Love', 'Birthday', 'Anniversary', 'Friendship', 'Apology', 'Custom'];
      const html = `
        <div class="space-y-4">
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-brand-dark mb-1">Gift Title</label>
            <input type="text" id="newGiftTitle" value="Our Memories & Surprises" class="w-full px-4 py-2.5 rounded-xl border border-brand-accent/60 focus:outline-none focus:ring-2 focus:ring-brand-primary text-sm">
          </div>
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-brand-dark mb-1">Gift Type</label>
            <select id="newGiftType" class="w-full px-4 py-2.5 rounded-xl border border-brand-accent/60 focus:outline-none focus:ring-2 focus:ring-brand-primary text-sm">
              ${types.map(t => `<option value="${t}">${t}</option>`).join('')}
            </select>
          </div>
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-brand-dark mb-1">Recipient Name</label>
            <input type="text" id="newRecipientName" value="Alex" class="w-full px-4 py-2.5 rounded-xl border border-brand-accent/60 focus:outline-none focus:ring-2 focus:ring-brand-primary text-sm">
          </div>
        </div>
      `;

      showModal('Create New Digital Gift', html, () => {
        const title = document.getElementById('newGiftTitle').value.trim();
        const type = document.getElementById('newGiftType').value;
        const recipient = document.getElementById('newRecipientName').value.trim();

        if (!title || !recipient) {
          showToast('Please fill in title and recipient name', 'warning');
          return;
        }

        const newGift = createNewBlankGift(title, type, recipient);
        STATE.drafts.push(newGift);
        saveDraftsToStorage();
        STATE.currentGift = newGift;
        STATE.activePageIndex = 0;
        STATE.history = [JSON.parse(JSON.stringify(newGift))];
        STATE.historyIndex = 0;
        STATE.view = 'EDITOR';
        renderApp();
      });
    }

    function openDraftEditor(draftId) {
      const draft = STATE.drafts.find(d => d.id === draftId);
      if (draft) {
        STATE.currentGift = JSON.parse(JSON.stringify(draft));
        STATE.activePageIndex = 0;
        STATE.history = [JSON.parse(JSON.stringify(draft))];
        STATE.historyIndex = 0;
        STATE.view = 'EDITOR';
        renderApp();
      }
    }

    function confirmDeleteDraft(draftId) {
      showModal('Delete Draft', 'Are you sure you want to delete this gift draft? This action cannot be undone.', () => {
        STATE.drafts = STATE.drafts.filter(d => d.id !== draftId);
        saveDraftsToStorage();
        renderApp();
        showToast('Draft deleted', 'info');
      });
    }

    function confirmDeletePublished(pubId) {
      showModal('Delete Published Gift', 'Delete this published gift link?', () => {
        STATE.publishedGifts = STATE.publishedGifts.filter(p => p.id !== pubId);
        savePublishedToStorage();
        renderApp();
        showToast('Published gift deleted', 'info');
      });
    }

    function exportGiftJSON(draftId) {
      const draft = STATE.drafts.find(d => d.id === draftId);
      if (!draft) return;
      const jsonStr = JSON.stringify(draft, null, 2);
      const blob = new Blob([jsonStr], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${draft.title.toLowerCase().replace(/\s+/g, '_')}_gift.json`;
      a.click();
      URL.revokeObjectURL(url);
      showToast('Project JSON exported!', 'success');
    }

    function promptImportJSON() {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = '.json';
      input.onchange = e => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = event => {
          try {
            const imported = JSON.parse(event.target.result);
            if (imported && imported.id && imported.pages) {
              STATE.drafts.push(imported);
              saveDraftsToStorage();
              renderApp();
              showToast('Gift project imported successfully!', 'success');
            } else {
              showToast('Invalid gift JSON format', 'error');
            }
          } catch (err) {
            showToast('Error parsing JSON file', 'error');
          }
        };
        reader.readAsText(file);
      };
      input.click();
    }

    function copyGiftLink(pubId) {
      const url = `${window.location.origin}${window.location.pathname}#gift/${pubId}`;
      navigator.clipboard.writeText(url).then(() => {
        showToast('Share link copied to clipboard! 📋', 'success');
      }).catch(() => {
        // Fallback for clipboard
        const input = document.createElement('input');
        input.value = url;
        document.body.appendChild(input);
        input.select();
        document.execCommand('copy');
        document.body.removeChild(input);
        showToast('Share link copied!', 'success');
      });
    }

      window.location.hash = `#gift/${pubId}`;
      renderApp();
    }

    // --- ELEMENT ADDERS & DRAGGING LOGIC ---
    function selectCanvasElement(e, id) {
      e.stopPropagation();
      STATE.selectedElementId = id;
      renderApp();
    }

    function deselectCanvasElement(e) {
      if (e.target.id === 'canvasBoard') {
        STATE.selectedElementId = null;
        renderApp();
      }
    }

    let dragItem = null;
    let dragStartX = 0, dragStartY = 0;
    let initialElX = 0, initialElY = 0;

    function startDragCanvasElement(e, id) {
      dragItem = id;
      dragStartX = e.clientX;
      dragStartY = e.clientY;

      const currentPage = STATE.currentGift.pages[STATE.activePageIndex];
      const el = currentPage.elements.find(item => item.id === id);
      if (el) {
        initialElX = el.x;
        initialElY = el.y;
      }

      window.addEventListener('mousemove', onDragCanvasElement);
      window.addEventListener('mouseup', stopDragCanvasElement);
    }

    function onDragCanvasElement(e) {
      if (!dragItem) return;
      const dx = e.clientX - dragStartX;
      const dy = e.clientY - dragStartY;

      const currentPage = STATE.currentGift.pages[STATE.activePageIndex];
      const el = currentPage.elements.find(item => item.id === dragItem);
      if (el) {
        el.x = Math.max(0, initialElX + dx);
        el.y = Math.max(0, initialElY + dy);
        const domEl = document.getElementById(dragItem);
        if (domEl) {
          domEl.style.left = el.x + 'px';
          domEl.style.top = el.y + 'px';
        }
      }
    }

    function stopDragCanvasElement() {
      if (dragItem) {
        pushHistoryState();
      }
      dragItem = null;
      window.removeEventListener('mousemove', onDragCanvasElement);
      window.removeEventListener('mouseup', stopDragCanvasElement);
    }

    function updateSelectedProp(prop, val) {
      const currentPage = STATE.currentGift.pages[STATE.activePageIndex];
      const el = currentPage.elements.find(e => e.id === STATE.selectedElementId);
      if (el) {
        el[prop] = val;
        pushHistoryState();
        renderApp();
      }
    }

    function duplicateSelectedElement() {
      const currentPage = STATE.currentGift.pages[STATE.activePageIndex];
      const el = currentPage.elements.find(e => e.id === STATE.selectedElementId);
      if (el) {
        const copy = JSON.parse(JSON.stringify(el));
        copy.id = 'el_' + Date.now();
        copy.x += 20;
        copy.y += 20;
        currentPage.elements.push(copy);
        STATE.selectedElementId = copy.id;
        pushHistoryState();
        renderApp();
      }
    }

    function deleteSelectedElement() {
      const currentPage = STATE.currentGift.pages[STATE.activePageIndex];
      currentPage.elements = currentPage.elements.filter(e => e.id !== STATE.selectedElementId);
      STATE.selectedElementId = null;
      pushHistoryState();
      renderApp();
    }

      STATE.activePageIndex = index;
      STATE.selectedElementId = null;
      renderApp();
    }

      const newPage = {
        id: 'page_' + (STATE.currentGift.pages.length + 1),
        title: 'Page ' + (STATE.currentGift.pages.length + 1),
        bgColor: '#FFFFFF',
        elements: []
      };
      STATE.currentGift.pages.push(newPage);
      STATE.activePageIndex = STATE.currentGift.pages.length - 1;
      pushHistoryState();
      renderApp();
    }

    function deletePage(index) {
      if (STATE.currentGift.pages.length <= 1) return;
      STATE.currentGift.pages.splice(index, 1);
      STATE.activePageIndex = Math.max(0, index - 1);
      pushHistoryState();
      renderApp();

        case 'letter':
          return `
            <div onclick="openLetterModal('${el.letterTitle || ''}', '${encodeURIComponent(el.letterBody || '')}')" class="absolute p-4 bg-pink-100/90 hover:bg-pink-200/90 cursor-pointer rounded-3xl border border-pink-200 shadow-md transition transform hover:scale-105 select-none" style="left: ${el.x}px; top: ${el.y}px; width: ${el.width || 280}px; z-index: ${el.zIndex || 1};">
              <div class="flex items-center gap-2 mb-2">
                <i class="fa-solid fa-envelope text-brand-primary"></i>
                <span class="text-xs font-bold text-brand-dark">Click To Open Letter</span>
              </div>
              <p class="font-romantic text-base text-brand-primary font-bold line-clamp-2">${el.letterTitle || 'Secret Letter'}</p>
            </div>
          `;

        case 'game':
          return `
            <div onclick="openMiniGameModal('${el.gameType}')" class="absolute p-4 bg-purple-100 hover:bg-purple-200 cursor-pointer rounded-3xl border border-purple-200 shadow-md transition transform hover:scale-105 select-none" style="left: ${el.x}px; top: ${el.y}px; width: ${el.width || 300}px; z-index: ${el.zIndex || 1};">
              <div class="flex items-center gap-2 mb-1">
                <i class="fa-solid fa-gamepad text-brand-primary"></i>
                <span class="text-xs font-bold text-brand-dark">${el.gameTitle || 'Mini Game'}</span>
              </div>
              <p class="text-[11px] text-gray-600">Click to play game!</p>
            </div>
          `;

        default:
          return '';
      }
    }

    function prevRecipientPage() {
      if (STATE.activePageIndex > 0) {
        STATE.activePageIndex--;
        renderApp();
      }
    }

    function nextRecipientPage() {
      if (STATE.activePageIndex < STATE.currentGift.pages.length - 1) {
        STATE.activePageIndex++;
        renderApp();
      }
    }

    function openLetterModal(title, encodedBody) {
      const body = decodeURIComponent(encodedBody);
      showModal(title || 'A Letter For You 💌', `
        <div class="p-4 bg-pink-50/60 rounded-2xl border border-pink-100 font-romantic text-lg text-brand-dark leading-relaxed whitespace-pre-wrap">
          ${body}
        </div>
      `);
    }

    function openMiniGameModal(gameType) {
      if (gameType === 'scratch-card') {
        showModal('Scratch Card Game 🪄', `
          <div class="flex flex-col items-center">
            <p class="text-xs text-gray-500 mb-3">Scratch below to reveal secret surprise!</p>
            <div id="scratchTarget" class="w-64 h-32 bg-gradient-to-r from-brand-primary to-brand-accent rounded-2xl flex items-center justify-center text-white font-romantic text-xl font-bold p-4 text-center cursor-pointer shadow-inner" onclick="this.innerHTML='❤️ You Are My Favorite Person! ❤️'">
              Click / Scratch Here
            </div>
          </div>
        `);
      } else {
        showModal('Mini Game Surprise 🎮', `
          <div class="text-center py-4">
            <span class="text-5xl mb-3 block">💖</span>
            <p class="text-sm font-bold text-brand-dark mb-2">You Won The Mini Challenge!</p>
            <p class="text-xs text-gray-500">Unlocking next special memory page...</p>
          </div>
        `);
      }
    }

    function openRecipientReplyModal() {
      showModal('Leave a Reply 💌', `
        <div class="space-y-4">
          <p class="text-xs text-gray-500">Send a lovely response back to the creator!</p>
          <textarea id="recipientReplyMsg" rows="3" placeholder="Write something sweet..." class="w-full p-3 rounded-xl border border-gray-200 text-xs focus:outline-none focus:border-brand-primary"></textarea>
        </div>
      `, () => {
        const msg = document.getElementById('recipientReplyMsg').value.trim();
        if (msg) {
          showToast('Reply sent to creator! 💖', 'success');
        }
      });
    }

    // --- INITIALIZATION ---
    window.onload = function() {
      loadSavedData();
      renderApp();
    };
  </script>
</body>
</html>
