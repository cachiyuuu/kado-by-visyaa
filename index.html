@keyframes rise{
 0%{

 15%{

 100%{

}

@keyframes driftSide{
 0%{
  transform:translate3d(0,20px,0) rotate(0) scale(var(--scale));
  opacity:0

 15%{
  opacity:.7
 }
 50%{
  transform:translate3d(var(--drift),-50vh,0) rotate(var(--rot)) scale(1)
 }
 100%{
  transform:translate3d(calc(var(--drift)*-1),-110vh,0) rotate(calc(var(--rot)*1.4)) scale(.75);
  opacity:0
 }
}

@keyframes swirlFloat{
 0%{
  transform:translate3d(0,30px,0) rotate(0) scale(var(--scale));
  opacity:0

 20%{
  opacity:.7
 }
 35%{
  transform:translate3d(var(--drift),-25vh,0) rotate(100deg) scale(1)
 }
 65%{
  transform:translate3d(calc(var(--drift)*-0.7),-65vh,0) rotate(220deg) scale(.9)
 }
 100%{
  transform:translate3d(var(--drift),-110vh,0) rotate(var(--rot)) scale(.65);
  opacity:0
 }
}

@keyframes fallParticle{
 0%{

 15%{

function addPhoto(style){
 items.push({
  id:crypto.randomUUID(),
  kind:'photo',
  style,
  title:photoStyles[style],
  url:'',
  caption:'Kenangan kecil yang aku suka 🤍',
  date:'',
  location:''
 });
 renderLists();
 change()
}

function addWebPhoto(url){
 if(!url)return;
 items.push({
  id:crypto.randomUUID(),
  kind:'photo',
  style:'classic',
  title:'📸 Foto dari Web',
  url:url,
  caption:'Kenangan dari web 🤍',
  date:'',
  location:'',
  resolvedFrom:''
 });
 renderLists();
 change();
 resolvePhotoURL(items.length-1,url)
}

function addCustomPhoto(){
 addPhoto('classic')
}

function filesToBlocks(files){
 [...files].forEach(file=>{
  const r=new FileReader();
  r.onload=e=>{
   items.push({
    id:crypto.randomUUID(),
    kind:'photo',
    style:'polaroid',
    title:'📸 Foto Kita',
    url:e.target.result,
    caption:'Simpan momen ini baik-baik 🤍',
    date:'',
    location:''
   });
   renderLists();
   change()
  };
  r.readAsDataURL(file)
 });
 toast('Foto ditambahkan ✨')
}

function addGame(type){
 items.push({
  id:crypto.randomUUID(),
  kind:'game',
  type,
  title:games[type],
  question:'Pertanyaan untuk kamu...',
  a:'Pilihan A',
  b:'Pilihan B',
  answer:'a',
  message:'Yay! Kamu berhasil! 🤍',
  pass:'1202',
  word:'LOVE',
  target:8,
  seconds:15,
  emoji:'♡',
  letter:'Aku punya sesuatu yang ingin kusampaikan...',
  sequence:'⭐💗🌸',
  numbers:'2468'
 });
 renderLists();
 change()
}

function addResponse(type){
 responseItems.push({
  id:crypto.randomUUID(),
  type,
  title:responses[type],
  prompt:defaultPrompt(type),
  button:'Kirim 🤍',
  after:'Makasih sudah cerita. Aku baca ya 🤍'
 });
 renderLists();
 change()
}

function defaultPrompt(t){
 return {
  letter:'Tulis surat kecil untukku...',
  guest:'Tinggalkan satu pesan di guestbook...',
  qa:'Apa satu hal yang ingin kamu bilang?',
  three:'Tulis 3 hal yang kamu suka dari kita.',
  wish:'Satu harapan kecil untuk kita...',
  memory:'Ceritakan satu memori favoritmu.',
  rating:'Seberapa kamu suka gift ini?',
  photo:'Kirim satu foto untukku.',
  choice:'Kamu sekarang lagi merasa apa?',
  free:'Cerita apa pun yang ingin kamu ceritakan...',
  voice:'Rekam pesan suara untukku (demo UI).'
 }[t]||'Cerita aja di sini...'
}

function renderLists(){
 $('photoLibrary').innerHTML=Object.entries(photoStyles)
  .map(([k,v])=>
   `<button class="libbtn photoLib"
   data-name="${v.toLowerCase()}"
   onclick="addPhoto('${k}')">${v} ➕</button>`
  ).join('');

 $('gameLibrary').innerHTML=Object.entries(games)
  .map(([k,v])=>
   `<button class="libbtn gameLib"
   data-name="${v.toLowerCase()}"
   onclick="addGame('${k}')">${v} ➕</button>`
  ).join('');

 $('responseLibrary').innerHTML=Object.entries(responses)
  .map(([k,v])=>
   `<button class="libbtn"
   onclick="addResponse('${k}')">${v} ➕</button>`
  ).join('');

 renderModuleList();
}

function filterLibrary(input,selector){
 const q=$(input).value.toLowerCase();

 document.querySelectorAll(selector).forEach(x=>
  x.style.display=x.dataset.name.includes(q)?'block':'none'
 )
}

function renderModuleList(){
 const list=$('moduleList');
 list.innerHTML='';

 items.forEach((it,i)=>{
  const c=document.createElement('div');
  c.className='card';

  c.innerHTML=`
   <div style="display:flex;gap:5px;align-items:center">
    <b style="flex:1">${esc(it.title)}</b>
    <button class="btn" onclick="move(${i},-1)">↑</button>
    <button class="btn" onclick="move(${i},1)">↓</button>
    <button class="btn danger" onclick="del(${i})">×</button>
   </div>
   ${it.kind==='photo'?photoEditor(it,i):gameEditor(it,i)}
  `;

  list.appendChild(c)
 });

 responseItems.forEach((it,i)=>{
  const c=document.createElement('div');
  c.className='card';

  c.innerHTML=`
   <div style="display:flex;gap:5px">
    <b style="flex:1">${esc(it.title)}</b>
    <button class="btn danger" onclick="delResponse(${i})">×</button>
   </div>

   <label>Judul</label>
   <input
    value="${escAttr(it.title)}"
    oninput="updResponse(${i},'title',this.value)"
   >

   <label>Pertanyaan / prompt</label>
   <textarea
    oninput="updResponse(${i},'prompt',this.value)"
   >${esc(it.prompt)}</textarea>

   <label>Tombol</label>
   <input
    value="${escAttr(it.button)}"
    oninput="updResponse(${i},'button',this.value)"
   >

   <label>Pesan setelah kirim</label>
   <input
    value="${escAttr(it.after)}"
    oninput="updResponse(${i},'after',this.value)"
   >
  `;

  list.appendChild(c)
 })
}

function photoEditor(it,i){
 return`
  <label>Judul</label>
  <input
   value="${escAttr(it.title)}"
   oninput="upd(${i},'title',this.value)"
  >

  <label>Link foto / Pinterest / web</label>
  <input
   value="${escAttr(it.url)}"
   placeholder="Tempel link Pinterest / gambar di sini..."
   oninput="upd(${i},'url',this.value)"
   onblur="resolvePhotoURL(${i},this.value)"
  >

  <div class="mini" id="photo-status-${it.id}">
   ${
    it.resolvedFrom
     ? '✓ Gambar ditemukan dari '+esc(it.resolvedFrom)
     : 'Tempel URL lalu klik di luar kolom — sistem akan mencoba menemukan gambar otomatis.'
   }
  </div>

  <label>Caption</label>
  <input
   value="${escAttr(it.caption)}"
   oninput="upd(${i},'caption',this.value)"
  >

  <div class="grid2">
   <input
    value="${escAttr(it.date)}"
    placeholder="Tanggal"
    oninput="upd(${i},'date',this.value)"
   >

   <input
    value="${escAttr(it.location)}"
    placeholder="Lokasi"
    oninput="upd(${i},'location',this.value)"
   >
  </div>
 `
}

function gameEditor(it,i){
 const t=it.type;
 let extra='';

 if([
  'quiz',
  'this_that',
  'memory_quiz',
  'guess_answer',
  'who_said',
  'favorites',
  'would_rather',
  'firsts',
  'flag'
 ].includes(t)){
  extra=`
   <div class="grid2">
    <div>
     <label>Opsi A</label>
     <input
      value="${escAttr(it.a)}"
      oninput="upd(${i},'a',this.value)"
     >
    </div>

    <div>
     <label>Opsi B</label>
     <input
      value="${escAttr(it.b)}"
      oninput="upd(${i},'b',this.value)"
     >
    </div>
   </div>

   <label>Jawaban benar</label>
   <select onchange="upd(${i},'answer',this.value)">
    <option value="a" ${it.answer==='a'?'selected':''}>A</option>
    <option value="b" ${it.answer==='b'?'selected':''}>B</option>
   </select>
  `
 }

 if([
  'letter_unlock',
  'secret_message',
  'final_unlock',
  'password'
 ].includes(t)){
  extra=`
   <label>Kode / Password</label>
   <input
    value="${escAttr(it.pass)}"
    oninput="upd(${i},'pass',this.value)"
   >

   <label>Isi surat / pesan rahasia</label>
   <textarea
    oninput="upd(${i},'letter',this.value)"
   >${esc(it.letter)}</textarea>
  `
 }

 if([
  'word',
  'hidden_words',
  'complete_letter'
 ].includes(t)){
  extra+=`
   <label>Kata / jawaban target</label>
   <input
    value="${escAttr(it.word)}"
    oninput="upd(${i},'word',this.value)"
   >
  `
 }

 if([
  'pop',
  'catch',

function move(i,d){
 const j=i+d;

 if(j<0||j>=items.length)return;

 change()
}

function esc(s){
 return String(s??'').replace(
  /[&<>]/g,
  c=>({
   '&':'&amp;',
   '<':'&lt;',
   '>':'&gt;'
  }[c])
 )
}

function escAttr(s){
 return esc(s)
  .replace(/"/g,'&quot;')
  .replace(/'/g,'&#39;')
}

 const r=document.documentElement.style;

 r.setProperty('--bg',$('bg').value);

 r.setProperty('--accent',$('accent').value);
 r.setProperty('--font',$('font').value);

}

 const n=Math.min(
  180,
  Math.max(10,+$('particleCount').value||60)
 );

 const speed=+$('particleSpeed').value||11;
 const baseSize=+$('particleSize').value||17;
 const opacity=(+$('particleOpacity').value||70)/100;
 const drift=$('particleDrift').value||'float';

 for(let i=0;i<n;i++){

  const p=document.createElement('span');

  p.className='p';

  p.textContent=
   symbols[Math.floor(Math.random()*symbols.length)];

  const x=Math.random()*100;

  const size=Math.max(
   6,
   baseSize*(.55+Math.random()*.9)
  );

  const duration=
   speed*(.65+Math.random()*.9);

  const delay=-Math.random()*duration;

  p.style.left=x+'%';
  p.style.fontSize=size+'px';
  p.style.animationDuration=duration+'s';
  p.style.animationDelay=delay+'s';
  p.style.opacity=
   Math.max(.12,opacity*(.55+Math.random()*.45));

  p.style.setProperty(
   '--drift',
   ((Math.random()-.5)*140)+'px'
  );

  p.style.setProperty(
   '--rot',
   (Math.random()*520-260)+'deg'
  );

   p.style.animationName='swirlFloat';

   p.style.animationName='fallParticle';

/* =========================
   ENCODE DATA GIFT
========================= */

function encodeGiftData(data){

 const json=JSON.stringify(data);

 const bytes=new TextEncoder().encode(json);

 let binary='';

 const chunk=0x8000;

 for(
  let i=0;
  i<bytes.length;
  i+=chunk
 ){
  binary+=String.fromCharCode(
   ...bytes.subarray(i,i+chunk)
  );
 }

 return btoa(binary)
  .replace(/\+/g,'-')
  .replace(/\//g,'_')
  .replace(/=+$/,'');
}


/* =========================
   DECODE DATA GIFT
========================= */

function decodeGiftData(encoded){

 encoded=encoded
  .replace(/-/g,'+')
  .replace(/_/g,'/');

 while(encoded.length%4)
  encoded+='=';

 const binary=atob(encoded);

 const bytes=Uint8Array.from(
  binary,
  c=>c.charCodeAt(0)
 );

 return JSON.parse(
  new TextDecoder('utf-8').decode(bytes)
 )
}


/* =========================
   GENERATE SHARE URL
========================= */

function generateShareUrl(mode){

 const data=encodeGiftData(
  payload()
 );

 const baseUrl=
  location.href.split('#')[0];

 if(mode==='edit')
  return baseUrl+'#edit='+data;

 if(mode==='fill')
  return baseUrl+'#fill='+data;

 return baseUrl+'#gift='+data;
}

 if(share){
  share.value=url;
  share.removeAttribute('disabled');
  share.style.cursor='text';
 }

 const qr=$('qr');

 if(qr){

  qr.innerHTML='';

  if(typeof QRCode!=='undefined'){

   try{

    new QRCode(qr,{
     text:url,
     width:140,
     height:140
    });

   }catch(e){

    qr.innerHTML=
     '<div style="font-size:10px;color:#8f8193">'+
     'QR belum tersedia, tapi link tetap bisa disalin.'+
     '</div>';

   }

  }else{

   qr.innerHTML=
    '<div style="font-size:10px;color:#8f8193">'+
    'QR belum tersedia, tapi link tetap bisa disalin.'+
    '</div>';

  }
 }

 return url;
}

/* =========================
   COPY LINK
========================= */

async function copyLink(){

 const share=$('shareUrl');

 const url=share
  ?share.value
  :'';

 if(!url){

  toast(
   'Link belum siap, coba buka menu Bagikan lagi 💗'
  );

  return;
 }

 try{

  if(
   navigator.share &&
   /Mobi|Android|iPhone|iPad/i
    .test(navigator.userAgent)
  ){

   await navigator.share({
    title:'Kado by Visyaa 💗',
    text:'Ada kado kecil buat kamu 💌',
    url
   });

   return;
  }

  if(
   navigator.clipboard &&
   window.isSecureContext
  ){

   await navigator.clipboard.writeText(url);

  }else{

   const ta=
    document.createElement('textarea');

   ta.value=url;

   ta.setAttribute(
    'readonly',
    ''
   );

   ta.style.position='fixed';
   ta.style.left='-9999px';

   document.body.appendChild(ta);

   ta.focus();
   ta.select();

   const ok=
    document.execCommand('copy');

   ta.remove();

   if(!ok)
    throw new Error(
     'copy command failed'
    );
  }

  toast(
   'Link berhasil disalin 📋'
  );

 }catch(e){

  if(
   e &&
   e.name==='AbortError'
  )
   return;

  if(share){

   share.focus();
   share.select();

  }

  toast(
   'Link sudah dipilih — tekan Ctrl+C untuk menyalin 💗'
  );
 }
}

/* =========================
   LOAD DATA DARI HASH
========================= */

function loadHash(){

 const h=location.hash;

 if(!h)return;

 try{

  let mode='';
  let encoded='';

  if(
   h.startsWith('#gift=')
  ){

   mode='gift';
   encoded=h.slice(6);

  }else if(
   h.startsWith('#edit=')
  ){

   mode='edit';
   encoded=h.slice(6);

  }else if(
   h.startsWith('#fill=')
  ){

   mode='fill';
   encoded=h.slice(6);

  }else{

   return;
  }


  /*
   * Decode data gift menggunakan
   * decoder UTF-8 yang baru.
   */

  const d=
   decodeGiftData(encoded);


  /*
   * Masukkan data ke editor / gift.
   */

  apply(d);


  /*
   * Mode penerima.
   */

  if(mode==='gift'){

   document.body
    .classList.add('receiver');

  }


  /*
   * Mode editor.
   */

  else if(mode==='edit'){

   document.body
    .classList.remove('receiver');

  }


  /*
   * Mode isi / response.
   */

  else if(mode==='fill'){

   document.body
    .classList.add('receiver');

   setTimeout(()=>{

    const rSec=
     document.querySelector(
      '.responseBox'
     );

    if(rSec){

     rSec.scrollIntoView({
      behavior:'smooth'
     });

    }

   },500);
  }

 }catch(e){

  console.error(
   'Gagal membaca data gift:',
   e
  );

  toast(
   'Data gift tidak bisa dibaca'
  );
 }
}
