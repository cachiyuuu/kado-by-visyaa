    // ==========================================
    // 2. STORAGE ENGINE (LOCAL + SHARED HYBRID)
    // ==========================================
    const getStorageData = (key, fallback) => {
      try {
        const data = localStorage.getItem(key);
        return data ? JSON.parse(data) : fallback;
      } catch (e) {
        console.error("Storage Read Error:", e);
        return fallback;
      }
    };

    const setStorageData = (key, value) => {
      try {
        localStorage.setItem(key, JSON.stringify(value));
      } catch (e) {
        console.error("Storage Write Error:", e);
      }
    };

    // ==========================================
    // 3. BACKGROUND PARTICLES COMPONENT
    // ==========================================
    function BackgroundParticles({ config }) {
      if (!config || !config.enabled) return null;
      
      const particleTypes = {
        hearts: "💗",
        stars: "⭐",
        flowers: "🌸",
        petals: "🪷",
        bubbles: "🫧",
        sparkles: "✨"
      };

      const symbol = particleTypes[config.type] || "💗";
      const count = config.count || 12;

      const particles = useMemo(() => {
        return Array.from({ length: count }).map((_, i) => ({
          id: i,
          left: `${Math.random() * 100}%`,
          duration: `${3 + Math.random() * 4}s`,
          delay: `${Math.random() * 3}s`,
          size: `${12 + Math.random() * 16}px`
        }));
      }, [count, config.type]);

      return (
        <div className="fixed inset-0 pointer-events-none overflow-hidden z-0">
          {particles.map((p) => (
            <div
              key={p.id}
              className="absolute animate-float opacity-60"
              style={{
                left: p.left,
                top: `${Math.random() * 90}%`,
                animationDuration: p.duration,
                animationDelay: p.delay,
                fontSize: p.size
              }}
            >
              {symbol}
            </div>
          ))}
        </div>
      );
    }

    // ==========================================
    // 4. MUSIC MANAGER PLAYER COMPONENT
    // ==========================================
    function MusicPlayer({ url, source }) {
      const [playing, setPlaying] = useState(false);
      if (!url) return null;

      const getSpotifyEmbed = (src) => {
        const match = src.match(/track\/([a-zA-Z0-9]+)/);
        return match ? `https://open.spotify.com/embed/track/${match[1]}?utm_source=generator&theme=0` : null;
      };

      const getYouTubeEmbed = (src) => {
        const match = src.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))([\w-]{11})/);
        return match ? `https://www.youtube.com/embed/${match[1]}?autoplay=1&loop=1` : null;
      };

      return (
        <div className="fixed bottom-4 right-4 z-40 bg-white/95 backdrop-blur-md p-2 rounded-2xl shadow-xl border border-[#e8b5ca] max-w-xs transition-all">
          {source === 'spotify' && getSpotifyEmbed(url) && (
            <iframe
              src={getSpotifyEmbed(url)}
              width="100%"
              height="80"
              frameBorder="0"
              allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
              loading="lazy"
              className="rounded-xl"
            />
          )}

          {source === 'youtube' && getYouTubeEmbed(url) && (
            <iframe
              width="0"
              height="0"
              src={getYouTubeEmbed(url)}
              title="YouTube Audio Engine"
              allow="autoplay"
            />
          )}

          {(source === 'mp3' || !source) && (
            <div className="flex items-center space-x-2 px-2 py-1">
              <audio id="global-audio-element" loop src={url} />
              <button
                onClick={() => {
                  const audio = document.getElementById('global-audio-element');
                  if (audio) {
                    if (playing) {
                      audio.pause();
                      setPlaying(false);
                    } else {
                      audio.play().catch(() => {});
                      setPlaying(true);
                    }
                  }
                }}
                className="px-3 py-1 bg-[#9b76a7] text-white rounded-full text-xs font-bold flex items-center gap-1 shadow"
              >
                {playing ? '⏸️ Pause Music' : '🎵 Tap to Play Music'}
              </button>
            </div>
          )}
        </div>
      );
    }

    // ==========================================
    // 5. GAME ENGINES (MODULAR)
    // ==========================================
    function CatcherEngine({ config, onWin }) {
      const [score, setScore] = useState(0);
      const [position, setPosition] = useState({ top: 30, left: 40 });
      const targetScore = config?.targetScore || 5;

      const handleCatch = () => {
        const nextScore = score + 1;
        setScore(nextScore);
        if (nextScore >= targetScore) {
          onWin();
        } else {
          setPosition({
            top: Math.floor(Math.random() * 65) + 10,
            left: Math.floor(Math.random() * 70) + 15
          });
        }
      };

      return (
        <div className="relative w-full h-52 bg-[#fff7fb] rounded-2xl overflow-hidden border border-[#e8b5ca] select-none">
          <div className="absolute top-2 left-3 text-xs font-bold text-[#5d5061] bg-white/80 px-2 py-1 rounded-lg">
            Skor: {score} / {targetScore}
          </div>
          <button
            onClick={handleCatch}
            style={{ top: `${position.top}%`, left: `${position.left}%` }}
            className="absolute text-3xl transform -translate-x-1/2 -translate-y-1/2 transition-all duration-200 active:scale-125"
          >
            🎯
          </button>
        </div>
      );
    }

    function ClickerEngine({ config, onWin }) {
      const [clicks, setClicks] = useState(0);
      const target = config?.targetScore || 8;

      const handleClick = () => {
        const next = clicks + 1;
        setClicks(next);
        if (next >= target) {
          onWin();
        }
      };

      return (
        <div className="p-4 text-center bg-[#fff7fb] rounded-2xl border border-[#e8b5ca]">
          <div className="text-3xl font-extrabold mb-3 text-[#5d5061]">{clicks} / {target}</div>
          <button
            onClick={handleClick}
            className="px-6 py-3 bg-[#9b76a7] text-white font-bold rounded-2xl shadow-md active:scale-95 transition"
          >
            Ketuk Di Sini! 💓
          </button>
        </div>
      );
    }

      ]);

      const handleFlip = (idx) => {
        const updated = [...cards];
        updated[idx].open = true;
        setCards(updated);

        if (updated.every(c => c.open)) {
          setTimeout(onWin, 400);
        }
      };

      return (
        <div className="grid grid-cols-2 gap-2 p-2">
          {cards.map((card, idx) => (
            <button
              key={idx}
              onClick={() => handleFlip(idx)}
              className="h-16 text-2xl bg-white border border-[#e8b5ca] rounded-2xl flex items-center justify-center shadow-sm"
            >
              {card.open ? card.val : '❓'}
            </button>
          ))}
        </div>
      );
    }

    function MysteryEngine({ config, onWin }) {
      const [step, setStep] = useState(1);
      const [code, setCode] = useState('');
      const secret = config?.secretPasscode || "1234";

      const handleUnlock = () => {
        if (code === secret) {
          setStep(2);
        } else {
          alert(`Kode salah! Gunakan sandi default: ${secret}`);
        }
      };

      return (
        <div className="p-4 bg-[#fff7fb] rounded-2xl border border-[#e8b5ca] text-center">
          {step === 1 && (
            <div className="space-y-3">
              <p className="text-xs font-semibold text-[#5d5061]">🔐 Masukkan Kode Rahasia Akhir:</p>
              <input
                type="text"
                maxLength={6}
                value={code}
                onChange={(e) => setCode(e.target.value)}
                placeholder="****"
                className="w-full text-center text-xl tracking-widest p-2 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-[#9b76a7]"
              />
              <button
                onClick={handleUnlock}

    function GameEngineHost({ gameConfig, onComplete }) {
      const [gameState, setGameState] = useState('idle');

      const renderEngine = () => {
        switch (gameConfig.type) {
          case 'catcher':
            return <CatcherEngine config={gameConfig.config} onWin={() => handleWin()} />;
          case 'clicker':
            return <ClickerEngine config={gameConfig.config} onWin={() => handleWin()} />;
          case 'quiz':
            return <QuizEngine config={gameConfig.config} onWin={() => handleWin()} />;
          case 'memory':
            return <MemoryEngine config={gameConfig.config} onWin={() => handleWin()} />;
          case 'mystery':
            return <MysteryEngine config={gameConfig.config} onWin={() => handleWin()} />;
          default:
            return <ClickerEngine config={gameConfig.config} onWin={() => handleWin()} />;
        }
      };

      const handleWin = () => {
        setGameState('won');
        if (onComplete) onComplete(gameConfig.id);
      };

      return (
        <div className="w-full max-w-sm mx-auto p-4 rounded-3xl shadow-sm border border-[#e8b5ca] bg-white text-center">
          <div className="text-3xl mb-1">{gameConfig.emoji}</div>
          <h3 className="text-sm font-bold text-[#5d5061]">{gameConfig.title}</h3>
          <p className="text-[11px] text-gray-500 mb-3">{gameConfig.description}</p>

          {gameState === 'idle' && (
            <div className="space-y-2">
              <p className="text-[11px] text-[#9b76a7] bg-[#fff7fb] p-2 rounded-xl">{gameConfig.instruction}</p>
              <button
                onClick={() => setGameState('playing')}
                className="w-full py-2 rounded-xl font-bold text-xs text-white shadow bg-[#9b76a7] active:scale-95 transition"
              >
                Mulai Main 🚀
              </button>
            </div>
          )}

          {gameState === 'playing' && renderEngine()}

          {gameState === 'won' && (
            <div className="py-3">
              <div className="text-3xl mb-1">🎉</div>
              <h4 className="text-xs font-bold text-green-600">Berhasil Diselesaikan!</h4>
              <p className="text-[11px] text-gray-600 my-1">{gameConfig.config?.winMessage || "+10 Hearts 💗"}</p>

    function App() {
      const [giftData, setGiftData] = useState(() => getStorageData('draft_gift', INITIAL_GIFT_DATA));
      const [mode, setMode] = useState('editor');
      const [shareUrl, setShareUrl] = useState('');

      // Auto-Detect Hash Route for Recipient Mode
      useEffect(() => {
        const hash = window.location.hash.replace('#', '');
        if (hash) {
          const loaded = getStorageData(`published_gift_${hash}`, null);
          if (loaded) {
            setGiftData(loaded);
            setMode('recipient');
          }
        }
      }, []);

      useEffect(() => {
        if (mode === 'editor') {
          setStorageData('draft_gift', giftData);
        }
      }, [giftData, mode]);

      const handlePublish = () => {
        const uniqueId = Math.random().toString(36).substring(2, 8);
        const publishedPayload = { ...giftData, id: uniqueId, status: 'published' };
        
        setStorageData(`published_gift_${uniqueId}`, publishedPayload);
        const url = `${window.location.origin}${window.location.pathname}#${uniqueId}`;
        setShareUrl(url);
      };

      if (shareUrl) {
        return (
          <div className="min-h-screen bg-[#fff7fb] flex items-center justify-center p-4">
            <div className="bg-white p-5 rounded-3xl border border-[#e8b5ca] shadow-xl max-w-xs w-full text-center space-y-3">
              <div className="text-4xl">🎉</div>
              <h2 className="text-sm font-bold text-[#5d5061]">Gift Berhasil Dipublish!</h2>
              <p className="text-[10px] text-gray-500">Bagikan link ini ke orang tersayang:</p>
              <input
                type="text"
                readOnly
                value={shareUrl}
                className="w-full p-2 bg-gray-50 border rounded-xl text-[10px] text-center font-mono select-all"
              />
              <div className="flex space-x-2 pt-1">
                <button
                  onClick={() => {
                    navigator.clipboard.writeText(shareUrl);
                    alert("Link berhasil disalin! 💗");
                  }}
                  className="flex-1 py-2 bg-[#e8b5ca] text-[#5d5061] text-xs font-bold rounded-xl"
                >
                  📋 Salin Link
                </button>
                <button
                  onClick={() => setShareUrl('')}
                  className="flex-1 py-2 bg-[#9b76a7] text-white text-xs font-bold rounded-xl"
                >
                  Tutup
                </button>
              </div>
            </div>
          </div>
        );
      }

      return (
        <div>
          {mode === 'editor' && (
            <EditorDashboard
              giftData={giftData}
              setGiftData={setGiftData}
              onPublish={handlePublish}
              onPreview={() => setMode('preview')}
            />
          )}

          {mode === 'preview' && (
            <RecipientView
              giftData={giftData}
              onBackToEditor={() => setMode('editor')}
            />
          )}

          {mode === 'recipient' && (
            <RecipientView
              giftData={giftData}
            />
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
