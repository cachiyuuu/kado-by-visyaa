<style>

*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Poppins,system-ui,sans-serif;color:var(--ink);background:radial-gradient(circle at 10% 0%,#fff 0 18%,transparent 35%),var(--bg)}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0}.app{min-height:100vh;display:grid;grid-template-columns:300px 1fr 340px;gap:14px;padding:14px}.panel{background:rgba(255,255,255,.9);border:1px solid rgba(230,220,236,.9);border-radius:var(--r);box-shadow:var(--shadow);backdrop-filter:blur(16px);overflow:hidden}.brand{padding:20px 18px 12px}.brand h1{font:24px Pacifico;color:var(--accent);margin:0}.brand p{font-size:12px;color:var(--muted);margin:6px 0}.nav{display:flex;gap:6px;padding:10px 12px;overflow:auto;border-bottom:1px solid var(--line)}.nav button{white-space:nowrap;padding:9px 12px;border-radius:12px;background:transparent;color:var(--muted)}.nav button.active{background:var(--soft);color:var(--accent);font-weight:700}.scroll{overflow:auto;height:calc(100vh - 112px);padding:12px}.section{margin-bottom:16px}.section h3{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:12px 5px}.field{margin:8px 0}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 11px;outline:none}.field textarea{min-height:95px;resize:vertical}.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(164,119,194,.12)}.btn{padding:10px 13px;border-radius:12px;background:var(--soft);color:var(--ink);font-weight:700}.btn.primary{background:linear-gradient(135deg,var(--accent),#c18bc8);color:#fff}.btn.ghost{background:#fff;border:1px solid var(--line)}.btn.danger{background:#fff0f3;color:#b54868}.row{display:flex;gap:7px}.row>*{flex:1}.chips{display:flex;flex-wrap:wrap;gap:7px}.chip{border:1px solid var(--line);background:#fff;padding:8px 9px;border-radius:12px;font-size:11px}.chip.active{border-color:var(--accent);background:var(--soft);color:var(--accent);font-weight:700}.template-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.template-card{border:1px solid var(--line);background:#fff;border-radius:14px;padding:9px;text-align:left;min-height:88px}.template-card:hover{border-color:var(--accent);transform:translateY(-1px)}.tpl-preview{height:52px;border-radius:10px;margin-bottom:6px;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}.tpl-preview span{font-size:20px}.tpl-preview.letter-p{background:linear-gradient(135deg,#fff8fb,#efe4f8)}.tpl-preview.letter-v{background:repeating-linear-gradient(0deg,#f3ead9 0 12px,#eadcc7 13px 14px)}.tpl-preview.letter-m{background:#191723;color:#fff}.tpl-preview.letter-f{background:linear-gradient(135deg,#eaf6ff,#fff)}.tpl-preview.photo-p{background:linear-gradient(135deg,#f8e8ef 0 30%,#fff 30% 70%,#e7d9f2 70%)}.tpl-preview.photo-f{background:linear-gradient(90deg,#222 0 8%,#eee 8% 16%,#222 16% 24%,#eee 24% 32%,#222 32% 40%,#eee 40% 48%,#222 48% 56%,#eee 56% 64%,#222 64% 72%,#eee 72% 80%,#222 80%)}.tpl-preview.photo-g{background:linear-gradient(90deg,#ffdce9 0 32%,#fff 32% 34%,#dbeeff 34% 66%,#fff 66% 68%,#e2f2d9 68%)}.tpl-preview.photo-v{background:linear-gradient(135deg,#e9dccb,#c6a47d)}.template-card .emoji{font-size:24px}.template-card b{display:block;font-size:11px;margin-top:4px}.template-card small{font-size:9px;color:var(--muted)}.workspace{min-width:0;display:flex;flex-direction:column;gap:12px}.topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 14px}.topbar .actions{display:flex;gap:7px;flex-wrap:wrap}.badge{padding:7px 10px;background:#fff;border:1px solid var(--line);border-radius:999px;font-size:11px;color:var(--muted)}.stage{flex:1;min-height:calc(100vh - 90px);display:flex;align-items:center;justify-content:center;padding:30px;background:linear-gradient(145deg,#f3edf8,#fff5f8 48%,#f0f7ff);border-radius:var(--r);position:relative;overflow:hidden}.stage:before,.stage:after{content:"";position:absolute;width:240px;height:240px;border-radius:50%;filter:blur(5px);opacity:.35;background:#e5c9f4;top:-90px;left:-80px}.stage:after{background:#ffd8e8;top:auto;left:auto;bottom:-110px;right:-80px}.phone{position:relative;width:min(390px,80vw);aspect-ratio:9/16;max-height:78vh;background:#fff;border:10px solid #2c2730;border-radius:38px;box-shadow:0 35px 80px rgba(31,20,38,.25);overflow:hidden;z-index:2}.phone-screen{width:100%;height:100%;position:relative;overflow:hidden;background:linear-gradient(#e9ddf4,#fff4f8)}.phone-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(140,110,160,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(140,110,160,.08) 1px,transparent 1px);background-size:20px 20px;pointer-events:none}.canvas-el{position:absolute;min-width:30px;min-height:20px;padding:4px;user-select:none;touch-action:none;cursor:move}.canvas-el.selected{outline:2px dashed var(--accent);outline-offset:3px}.canvas-el img{max-width:100%;display:block;border-radius:14px;pointer-events:none}.handle{display:none;position:absolute;right:-7px;bottom:-7px;width:14px;height:14px;border-radius:50%;background:var(--accent);border:2px solid #fff}.canvas-el.selected .handle{display:block}.toolbar{display:flex;gap:6px;flex-wrap:wrap;position:absolute;left:14px;bottom:14px;z-index:4}.righthead{padding:16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.righthead strong{font-size:13px}.layers{padding:10px;display:flex;flex-direction:column;gap:7px}.layer{display:flex;align-items:center;gap:7px;padding:9px;border:1px solid var(--line);border-radius:12px;background:#fff;font-size:11px}.layer.selected{border-color:var(--accent);background:var(--soft)}.layer .dot{width:22px;height:22px;border-radius:7px;background:var(--soft);display:grid;place-items:center}.spacer{flex:1}.small{font-size:10px;color:var(--muted)}.toast{position:fixed;right:18px;bottom:18px;background:#302b37;color:#fff;padding:11px 14px;border-radius:13px;box-shadow:var(--shadow);z-index:9999;opacity:0;transform:translateY(10px);pointer-events:none;transition:.25s}.toast.show{opacity:1;transform:none}.modal{position:fixed;inset:0;background:rgba(38,27,44,.45);display:none;place-items:center;z-index:9000;padding:18px}.modal.show{display:grid}.modal-card{width:min(680px,95vw);max-height:90vh;overflow:auto;background:#fff;border-radius:24px;padding:20px;box-shadow:0 30px 100px rgba(0,0,0,.25)}.modal-card h2{margin:0 0 6px}.modal-card .close{float:right;border-radius:50%;width:34px;height:34px;background:var(--soft)}.urlbox{display:flex;gap:8px}.urlbox input{flex:1;padding:12px;border:1px solid var(--line);border-radius:12px}.preview-card{background:linear-gradient(145deg,#fbf5ff,#fff6fa);border:1px solid var(--line);padding:16px;border-radius:18px}.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.gallery img{width:100%;aspect-ratio:1;border-radius:12px;object-fit:cover}.hidden{display:none!important}.recipient{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 20% 20%,#f0dff8,transparent 35%),radial-gradient(circle at 80% 80%,#ffdce9,transparent 35%),#fff}.gift-shell{width:min(560px,96vw);background:rgba(255,255,255,.82);border:1px solid #fff;border-radius:30px;padding:20px;box-shadow:0 30px 90px rgba(60,35,70,.16);backdrop-filter:blur(18px)}.gift-scene{position:relative;min-height:560px;border-radius:25px;overflow:hidden;background:linear-gradient(#cfeeff 0%,#f9f1ff 58%,#b8d9a4 58%,#8ebd7c 100%);display:flex;align-items:flex-end;justify-content:center;padding:28px}.cloud{position:absolute;width:120px;height:38px;border-radius:50px;background:rgba(255,255,255,.72);top:65px;left:30px}.cloud:after,.cloud:before{content:"";position:absolute;border-radius:50%;background:inherit}.cloud:before{width:55px;height:55px;left:20px;top:-23px}.cloud:after{width:65px;height:65px;right:15px;top:-30px}.cloud.two{left:auto;right:25px;top:125px;transform:scale(.72)}.garden{position:absolute;inset:auto 0 0;height:48%;background:linear-gradient(#b7d99c,#87b971)}.path{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:170px;height:68%;background:#e8d7c2;border-radius:50% 50% 0 0/20% 20% 0 0}.characters{position:absolute;bottom:95px;display:flex;align-items:flex-end;gap:22px}.char{width:92px;height:130px;position:relative;animation:float 3s ease-in-out infinite}.char:nth-child(2){animation-delay:.5s}.head{width:65px;height:65px;border-radius:50%;background:#f6c9a9;position:absolute;top:0;left:14px;border:4px solid rgba(72,45,50,.08)}.hair{position:absolute;left:10px;top:-3px;width:72px;height:42px;background:#5c3a31;border-radius:45px 45px 18px 18px;z-index:2}.boy .hair{background:#6a4436}.eye{position:absolute;width:7px;height:10px;background:#49353a;border-radius:50%;top:30px}.eye.l{left:28px}.eye.r{right:28px}.body{position:absolute;bottom:0;left:13px;width:66px;height:72px;border-radius:25px 25px 16px 16px;background:#cda8e5}.boy .body{background:#8fb6d8}.arm{position:absolute;width:48px;height:14px;border-radius:20px;background:#f6c9a9;top:72px;z-index:3}.arm.l{left:0;transform:rotate(25deg)}.arm.r{right:0;transform:rotate(-25deg)}.hug .arm.l{transform:rotate(-25deg);left:30px}.hug .arm.r{transform:rotate(25deg);right:30px}.heart{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);font-size:30px;animation:beat 1.2s infinite;z-index:4}.bubble{position:absolute;top:25px;left:50%;transform:translateX(-50%);width:82%;background:#fff;border-radius:18px;padding:13px 15px;text-align:center;box-shadow:0 12px 30px rgba(60,40,70,.12);z-index:7;font-size:13px}.bubble b{color:var(--accent)}.gift-cover{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(145deg,#fff0f7,#efe5fa);z-index:8;transition:.7s}.gift-cover.open{opacity:0;pointer-events:none;transform:scale(1.06)}.giftbox{width:160px;height:130px;position:relative}.boxbase{position:absolute;left:15px;bottom:0;width:130px;height:92px;border-radius:12px;background:#b88bd0}.lid{position:absolute;left:5px;top:25px;width:150px;height:30px;border-radius:10px;background:#d39ac0;transition:.7s}.ribbon{position:absolute;left:72px;top:20px;width:17px;height:100px;background:#f6d4e4;z-index:2}.gift-cover.open .lid{transform:translateY(-80px) rotate(-7deg)}.open-btn{position:absolute;bottom:30px;left:50%;transform:translateX(-50%);padding:13px 18px;border-radius:999px;background:#fff;color:var(--accent);font-weight:800;box-shadow:0 10px 30px rgba(0,0,0,.12);z-index:9}.letter-view{margin-top:16px;background:#fff;border-radius:20px;padding:20px;box-shadow:inset 0 0 0 1px var(--line)}.letter-view h1{font-family:Playfair Display,serif}.letter-view p{line-height:1.8;color:#615867}.recipient-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.game-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.game-card{padding:12px;border:1px solid var(--line);border-radius:14px;background:#fff}.game-card h4{margin:4px 0;font-size:12px}.game-card p{margin:0;color:var(--muted);font-size:10px}.game-area{margin-top:12px;padding:15px;border-radius:16px;background:#faf7fc;border:1px solid var(--line)}.target{font-size:46px;text-align:center;padding:25px;user-select:none}.wheel{width:210px;height:210px;border-radius:50%;margin:10px auto;background:conic-gradient(#e9c9ef 0 25%,#ffd6e5 25% 50%,#d7ebff 50% 75%,#d9efcf 75%);display:grid;place-items:center;border:8px solid #fff;box-shadow:var(--shadow);transition:transform 1s}.wheel span{background:#fff;border-radius:50%;padding:20px;font-weight:800}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{padding:10px;border:1px solid var(--line);border-radius:12px;background:#fff}.stat b{font-size:18px}.stat small{display:block;color:var(--muted)}
@keyframes float{50%{transform:translateY(-7px)}}@keyframes beat{50%{transform:translate(-50%,-50%) scale(1.2)}}
@media(max-width:1100px){.app{grid-template-columns:260px 1fr}.right-panel{display:none}}@media(max-width:760px){.app{display:block;padding:8px}.left-panel{display:none}.stage{min-height:calc(100vh - 80px);padding:10px}.phone{max-height:82vh;width:min(390px,92vw)}.topbar{gap:8px}.topbar .actions .hide-mobile{display:none}}

<body>
<div id="app" class="app">
  <aside class="panel left-panel">
    <div class="brand"><h1>Little Gift Studio</h1><p>V2 · make something they can keep ♡</p></div>
    <div class="nav" id="tabs">
      <button class="active" data-tab="content">Isi</button><button data-tab="templates">Template</button><button data-tab="media">Media</button><button data-tab="style">Style</button><button data-tab="games">Games</button>
    </div>
    <div class="scroll" id="leftContent"></div>
  </aside>

  <main class="workspace">
    <div class="panel topbar">
      <div><span class="badge" id="saveStatus">● tersimpan lokal</span> <span class="badge" id="modeBadge">EDITOR</span></div>
      <div class="actions"><button class="btn ghost" id="undo">↶</button><button class="btn ghost" id="redo">↷</button><button class="btn ghost" id="preview">Preview</button><button class="btn primary" id="share">♡ Salin Link</button></div>
    </div>
    <section class="stage panel"><div class="phone" id="phone"><div class="phone-screen" id="phoneScreen"><div class="phone-grid"></div></div></div></section>
  </main>

  <aside class="panel right-panel">
    <div class="righthead"><strong>Layers & Properties</strong><span class="small" id="selectedInfo">tidak ada</span></div>
    <div class="scroll" style="height:calc(100vh - 64px)">
      <div class="section"><h3>Layers</h3><div id="layers" class="layers"></div></div>
      <div class="section"><h3>Elemen</h3><div class="row"><button class="btn" id="addText">＋ Text</button><button class="btn" id="addSticker">＋ Sticker</button></div><div style="height:7px"></div><button class="btn" id="addPhoto" style="width:100%">＋ Tambah foto ke canvas</button></div>
      <div class="section" id="props"></div>
      <div class="section"><h3>Quick actions</h3><div class="row"><button class="btn" id="front">↑ Depan</button><button class="btn" id="back">↓ Belakang</button></div><div style="height:7px"></div><button class="btn danger" id="delete" style="width:100%">Hapus elemen</button></div>
    </div>
  </aside>
</div>

<div id="modal" class="modal"><div class="modal-card"><button class="close" id="modalClose">×</button><div id="modalBody"></div></div></div>
<div id="toast" class="toast"></div>
<input id="fileInput" type="file" accept="image/*" class="hidden">

<script>
(() => {
'use strict';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const uid=(p='el')=>p+'_'+Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const escapeHTML=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function toast(t){const x=$('#toast');x.textContent=t;x.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>x.classList.remove('show'),2200)}

const letterSeeds=[
['A Little Note','Untuk kamu yang selalu bikin hari biasa terasa lebih hangat.'],['Midnight Letter','Kalau kamu membaca ini tengah malam, semoga kamu merasa ditemani.'],['Thank You','Terima kasih untuk hal-hal kecil yang sering nggak sempat aku bilang.'],['Open When Sad','Buka ini saat hari sedang berat.'],['Open When Happy','Simpan ini untuk hari yang rasanya ingin dirayakan.'],['For Your Birthday','Hari ini tentang kamu, dan aku senang bisa ikut ada di dalamnya.'],['Our Story','Tentang dua orang yang pelan-pelan menjadi rumah.'],['Tiny Promise','Aku nggak janji semuanya mudah, tapi aku mau terus jujur.'],['Read This Slowly','Nggak perlu buru-buru. Baca pelan-pelan.'],['You Are Loved','Mungkin nggak selalu terdengar, tapi kamu disayang.'],['A Pocket Hug','Kalau aku nggak ada di sebelahmu, anggap ini pelukan kecil.'],['Before You Sleep','Semoga malam ini lebih tenang daripada yang kamu pikirkan.'],['Good Morning','Semoga pagi ini memperlakukanmu dengan lembut.'],['When You Miss Me','Kalau kangen, buka halaman ini dan ingat bahwa aku juga pernah tersenyum karenamu.'],['Reasons','Beberapa alasan kenapa keberadaanmu berarti.'],['Little Things','Kumpulan hal kecil yang diam-diam aku suka dari kamu.'],['Future Us','Untuk versi kita yang belum kita temui.'],['No Perfect Days','Kita nggak perlu sempurna untuk punya sesuatu yang baik.'],['Stay Awhile','Kalau boleh, jangan buru-buru pergi dari cerita ini.'],['A Letter From Me','Aku menulis ini karena ada hal yang lebih mudah ditulis daripada diucapkan.']
];
const letterStyles=['p','v','m','f'];const letterTemplates=[];for(let i=0;i<60;i++){const b=letterSeeds[i%letterSeeds.length],style=letterStyles[Math.floor(i/15)],variant=Math.floor(i/20)+1;letterTemplates.push({id:'letter_'+i,title:b[0]+' · '+String(i+1).padStart(2,'0'),body:b[1]+' '+['Aku ingin menyimpan kalimat ini untuk hari ketika kamu butuh diingatkan bahwa kamu berarti.','Kalau suatu hari kamu lupa, semoga halaman kecil ini membantu mengingatnya lagi.','Nggak harus sempurna; cukup dibaca pelan-pelan dan dirasakan.'][i%3],emoji:['💌','🌷','🌙','🫶','☁️','🎀','🌼','🕯️','📖','💗'][i%10],font:['Playfair Display','Poppins','Quicksand','DM Sans'][i%4],style,variant})}
const photoLayouts=[];const layoutNames=['Polaroid','Film Strip','Soft Frame','Scrapbook','Tape Note','Postcard','Gallery Duo','Big Memory','Tiny Grid','Heart Frame','Rounded Diary','Vintage Print','Magazine','Photo Booth','Contact Sheet','Love Receipt','Memory Wall','Album Cover'];const photoStyles=['p','f','g','v'];for(let i=0;i<72;i++){photoLayouts.push({id:'photo_'+i,title:layoutNames[i%layoutNames.length]+' '+String(i+1).padStart(2,'0'),emoji:['🖼️','📸','🎞️','💗','🌷','✦'][i%6],ratio:['1/1','4/5','3/4','16/9'][i%4],rotate:(i%5-2)*1.5,caption:['our little moment','this one feels like home','saved in my heart','a day worth keeping','tiny memory, big feeling'][i%5],style:photoStyles[Math.floor(i/18)]})}
const themes={
 lavender:{name:'Lavender Dream',bg:'#f4eafb',accent:'#a477c2',accent2:'#e6bdd8',ink:'#332b39'},
 blush:{name:'Blush Diary',bg:'#fff0f5',accent:'#d27e9e',accent2:'#f5c6d7',ink:'#3a2930'},
 cloud:{name:'Cloudy Blue',bg:'#edf6ff',accent:'#78a9cf',accent2:'#c9e2f5',ink:'#26343e'},
 matcha:{name:'Matcha Picnic',bg:'#eff8ea',accent:'#77a76e',accent2:'#cfe7c5',ink:'#2e3a2c'},
 midnight:{name:'Midnight Letter',bg:'#191723',accent:'#cba7ee',accent2:'#5d4c73',ink:'#f7f1ff'},
 monochrome:{name:'Black & White',bg:'#f4f4f4',accent:'#333',accent2:'#ddd',ink:'#171717'},
 vintage:{name:'Vintage Paper',bg:'#f3ead9',accent:'#9d6c4b',accent2:'#d7b895',ink:'#46372d'},
 sunset:{name:'Soft Sunset',bg:'#fff0dc',accent:'#d88b68',accent2:'#f2c4a4',ink:'#44302b'}
};
const games=[

function decodeHash(){const h=location.hash;if(h.startsWith('#gift=')){try{return JSON.parse(decodeURIComponent(escape(atob(h.slice(6)))))}catch(e){return null}}return null}
async function loadSlug(id){const base=PUBLIC_API||localStorage.getItem('lgs_api')||'';if(!base)return null;try{const r=await fetch(base.replace(/\/$/,'')+'/gifts/'+encodeURIComponent(id));if(!r.ok)throw new Error('not found');const j=await r.json();return j.gift||null}catch(e){return null}}
function embedMusic(m){if(!m?.url)return '';const u=m.url; if(m.type==='spotify'&&/spotify\.com\//.test(u)){const x=u.split('?')[0].replace('open.spotify.com/','open.spotify.com/embed/');return `<iframe style="width:100%;height:152px;border:0;border-radius:12px" src="${escapeHTML(x)}" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>`} if(m.type==='youtube'){let id='';try{const z=new URL(u);id=z.hostname.includes('youtu.be')?z.pathname.slice(1):z.searchParams.get('v')||z.pathname.split('/').filter(Boolean).pop()}catch(e){}if(id)return `<iframe style="width:100%;aspect-ratio:16/9;border:0;border-radius:12px" src="https://www.youtube.com/embed/${encodeURIComponent(id)}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen loading="lazy"></iframe>`}if(m.type==='audio')return `<audio controls style="width:100%" src="${escapeHTML(u)}"></audio>`;return ''}
function openRecipient(url){const d=decodeHashFrom(url);if(!d)return;document.body.innerHTML=`<main class="recipient"><div class="gift-shell" id="recipientRoot"></div></main>`;document.body.className='recipient-body';renderRecipient(d)}
function decodeHashFrom(url){try{const h=new URL(url).hash;return JSON.parse(decodeURIComponent(escape(atob(h.slice(6)))))}catch(e){return null}}
function renderRecipient(d){const t=themes[d.theme]||themes.lavender;document.documentElement.style.setProperty('--accent',t.accent);const root=$('#recipientRoot');root.innerHTML=`<div class="gift-scene" id="giftScene" style="background:linear-gradient(${t.bg},#fff6fb 58%,#b8d99c 58%,#8ebd7c 100%)"><div class="cloud"></div><div class="cloud two"></div><div class="garden"></div><div class="path"></div><div class="bubble">Untuk <b>${escapeHTML(d.to||'kamu')}</b><br>${escapeHTML(d.title||'Ada sesuatu untuk kamu')}</div><div class="characters" id="chars"><div class="char girl"><div class="hair"></div><div class="head"><i class="eye l"></i><i class="eye r"></i></div><div class="body"></div><div class="arm l"></div><div class="arm r"></div></div><div class="char boy"><div class="hair"></div><div class="head"><i class="eye l"></i><i class="eye r"></i></div><div class="body"></div><div class="arm l"></div><div class="arm r"></div></div><div class="heart">♡</div></div><div class="gift-cover" id="cover"><div class="giftbox"><div class="lid"></div><div class="ribbon"></div><div class="boxbase"></div></div><button class="open-btn" id="openGift">Buka kadonya ♡</button></div></div><div class="letter-view" style="font-family:${escapeHTML(d.font||'Poppins')}"><div class="small">little gift · made with intention</div><h1>${escapeHTML(d.title||'Untuk kamu')}</h1><p>${escapeHTML(d.message||'')}</p><p><b>— ${escapeHTML(d.from||'Aku')}</b></p>${embedMusic(d.music)}<div class="recipient-actions"><button class="btn primary" id="playGame">🎮 Main game</button>${d.reply?'<button class="btn ghost" id="replyBtn">💌 Balas</button>':''}</div><div id="replyArea"></div></div>`;
$('#openGift').onclick=()=>{$('#cover').classList.add('open');$('#chars').classList.add('hug');if(d.animations!==false)spawnParticles();setTimeout(()=>{$('#playGame').onclick=()=>openGame(games.find(g=>d.game?.startsWith(g.id))||games[0]);$('#replyBtn')?.addEventListener('click',()=>{$('#replyArea').innerHTML='<textarea id="replyText" placeholder="Tulis balasanmu..." style="width:100%;margin-top:10px;min-height:90px;border:1px solid var(--line);border-radius:12px;padding:10px"></textarea><button class="btn primary" id="sendReply" style="margin-top:7px">Kirim</button>';$('#sendReply').onclick=()=>toast('Balasan tersimpan di perangkat ini ♡')});},500)};
}
function spawnParticles(){const s=$('#giftScene');for(let i=0;i<18;i++){const p=document.createElement('span');p.textContent=['♡','✦','🌷','🎀','•'][i%5];p.style.cssText=`position:absolute;left:${Math.random()*100}%;top:${45+Math.random()*35}%;font-size:${12+Math.random()*18}px;z-index:6;animation:float ${2+Math.random()*2}s ease-in-out infinite;opacity:.8`;s.appendChild(p)}}
(async()=>{load();const idb=await idbLoad();if(idb)state={...defaultState,...idb,music:{...defaultState.music,...(idb.music||{})}};const h=location.hash;if(h.startsWith('#gift=')){const fromHash=decodeHash();document.body.innerHTML=`<main class="recipient"><div class="gift-shell" id="recipientRoot"></div></main>`;if(fromHash)renderRecipient(fromHash);else renderRecipient(defaultState)}else if(h.startsWith('#gift-id=')){const slug=decodeURIComponent(h.slice(9));const gift=await loadSlug(slug);document.body.innerHTML=`<main class="recipient"><div class="gift-shell" id="recipientRoot"></div></main>`;if(gift)renderRecipient(gift);else {document.querySelector('#recipientRoot').innerHTML='<div class="preview-card"><h2>Gift tidak ditemukan</h2><p>Link ini membutuhkan API short-link yang aktif.</p></div>'}}else render();})();
})();
</script>
</body>
</html>
