        // Initial Default State Template
        const DEFAULT_GIFT_DATA = {

                }
            ]
        };

        
        // Save to JSONBin.io under bin data structure
        async function publishToJSONBin(giftData) {
            try {
                // Fetch current bin first to append/update map of token
                const token = "g_" + Math.random().toString(36).substring(2, 9);
                
                const getRes = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}/latest`, {
                    headers: { 'X-Master-Key': JSONBIN_MASTER_KEY }
                });
                
                let currentContent = {};
                if (getRes.ok) {
                    const json = await getRes.json();
                    currentContent = json.record || {};
                }

                currentContent[token] = giftData;

                const putRes = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': JSONBIN_MASTER_KEY
                    },
                    body: JSON.stringify(currentContent)
                });

                if (putRes.ok) {
                    return token;
                } else {
                    throw new Error("Gagal mengunggah ke JSONBin");
                }
            } catch (err) {
                console.error("JSONBin Error:", err);
                throw err;
            }
        }

        // Fetch custom token payload from JSONBin
        async function fetchFromJSONBin(token) {
            try {
                const res = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}/latest`, {
                    headers: { 'X-Master-Key': JSONBIN_MASTER_KEY }
                });
                if (res.ok) {
                    const json = await res.json();
                    return json.record?.[token] || null;
                }
            } catch (err) {
                console.error("Fetch Error:", err);
            }
            return null;
        }

        function ParticleBackground({ type = 'hearts' }) {
            const symbols = {
                hearts: ['❤️', '💖', '💕', '💗', '🌸'],
                stars: ['⭐', '🌟', '✨', '💫', '🌙'],
                sparkles: ['✨', '💎', '🔮', '⚡', '💫'],
                flowers: ['🌸', '🌺', '🌷', '🌼', '🌹']
            };

            const items = symbols[type] || symbols.hearts;
            const particles = Array.from({ length: 18 });

            return (
                <div className="fixed inset-0 pointer-events-none overflow-hidden z-0">
                    {particles.map((_, i) => {
                        const symbol = items[i % items.length];
                        const left = (i * 5.5 + Math.random() * 5) % 100;
                        const duration = 6 + (i % 5) * 2;
                        const size = 1.2 + (i % 3) * 0.5;
                        const delay = (i % 7) * 0.8;

                        return (
                            <span
                                key={i}
                                className="particle"
                                style={{
                                    left: `${left}%`,
                                    animationDuration: `${duration}s`,
                                    animationDelay: `${delay}s`,
                                    fontSize: `${size}rem`
                                }}
                            >
                                {symbol}
                            </span>
                        );
                    })}
                </div>
            );
        }

        function App() {
            const [giftData, setGiftData] = useState(() => {
                const local = localStorage.getItem('kado_visyaa_draft');
                return local ? JSON.parse(local) : DEFAULT_GIFT_DATA;
            });

            const [viewMode, setViewMode] = useState('editor'); // 'editor' | 'recipient'
            const [recipientToken, setRecipientToken] = useState(null);
            const [isLoadingToken, setIsLoadingToken] = useState(false);
            const [activeTab, setActiveTab] = useState('cover'); // 'cover', 'letters', 'games', 'photos', 'settings'
            const [publishUrl, setPublishUrl] = useState('');
            const [showSuccessModal, setShowSuccessModal] = useState(false);
            const [isPublishing, setIsPublishing] = useState(false);

            // Auto-save draft locally
            useEffect(() => {
                localStorage.setItem('kado_visyaa_draft', JSON.stringify(giftData));
            }, [giftData]);

            // Check URL Hash for Recipient View (#/g/TOKEN)
            useEffect(() => {
                const handleHashChange = async () => {
                    const hash = window.location.hash;
                    if (hash.startsWith('#/g/')) {
                        const token = hash.replace('#/g/', '');
                        if (token) {
                            setIsLoadingToken(true);
                            setRecipientToken(token);
                            const cloudData = await fetchFromJSONBin(token);
                            if (cloudData) {
                                setGiftData(cloudData);
                                setViewMode('recipient');
                            } else {
                                alert("Kado tidak ditemukan atau koneksi error!");
                            }
                            setIsLoadingToken(false);
                        }
                    } else {
                        setViewMode('editor');
                    }
                };

                handleHashChange();
                window.addEventListener('hashchange', handleHashChange);
                return () => window.removeEventListener('hashchange', handleHashChange);
            }, []);

            // Re-render lucide icons on tab or state change
            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            }, [activeTab, viewMode, giftData]);

            // Publish Gift Handler
            const handlePublish = async () => {
                setIsPublishing(true);
                try {
                    const token = await publishToJSONBin(giftData);
                    const fullUrl = `${window.location.origin}${window.location.pathname}#/g/${token}`;
                    setPublishUrl(fullUrl);
                    setShowSuccessModal(true);
                } catch (e) {
                    alert("Gagal mempublikasikan kado. Periksa koneksi internet Anda.");
                } finally {
                    setIsPublishing(false);
                }
            };

            const copyToClipboard = (text) => {
                const tempInput = document.createElement("input");
                tempInput.value = text;
                document.body.appendChild(tempInput);
                tempInput.select();
                document.execCommand("copy");
                document.body.removeChild(tempInput);
                alert("Link kado berhasil disalin ke clipboard! 🎉");
            };

            if (isLoadingToken) {
                return (
                    <div className="min-h-screen flex flex-col items-center justify-center bg-brand-bg text-brand-700">

                        <p className="text-sm opacity-75 mt-1">Sabar ya, lagi disiapin kejutan manisnya!</p>
                    </div>
                );

            return (

                            <div>
                                <h1 className="font-handwriting text-2xl font-bold text-brand-600 leading-none">kado-by-visyaa</h1>
                                <p className="text-[10px] text-brand-700 font-semibold tracking-wider uppercase">Interactive Builder</p>
                            </div>
                        </div>

                        <div className="flex items-center gap-2">
                            {viewMode === 'editor' ? (
                                <>
                                    <button
                                        onClick={() => setViewMode('recipient')}
                                        className="flex items-center gap-1.5 text-xs font-semibold px-3 py-2 rounded-xl bg-brand-100 text-brand-700 hover:bg-brand-200 transition"
                                    >
                                        <i data-lucide="eye" className="w-4 h-4"></i>
                                        <span className="hidden sm:inline">Live Preview</span>
                                    </button>
                                    <button
                                        onClick={handlePublish}
                                        disabled={isPublishing}
                                        className="flex items-center gap-1.5 text-xs font-bold px-4 py-2 rounded-xl bg-gradient-to-r from-brand-300 to-brand-600 text-white shadow-md hover:opacity-90 transition disabled:opacity-50"
                                    >
                                        <i data-lucide="send" className="w-4 h-4"></i>
                                        {isPublishing ? "Publishing..." : "Publish 🚀"}
                                    </button>
                                </>
                            ) : (
                                <button
                                    onClick={() => {
                                        window.location.hash = '';
                                        setViewMode('editor');
                                    }}
                                    className="flex items-center gap-1.5 text-xs font-bold px-4 py-2 rounded-xl bg-white text-brand-700 shadow border border-brand-200 hover:bg-brand-50 transition"
                                >
                                    <i data-lucide="edit-3" className="w-4 h-4"></i>
                                    Kembali ke Editor
                                </button>
                            )}
                        </div>
                    </header>

                    {/* Main Workspace Area */}
                    <main className="flex-1 max-w-5xl w-full mx-auto p-3 sm:p-6 z-10">
                        {viewMode === 'editor' ? (
                            <EditorWorkspace
                                giftData={giftData}
                                setGiftData={setGiftData}
                                activeTab={activeTab}
                                setActiveTab={setActiveTab}
                            />
                        ) : (
                            <RecipientWorkspace giftData={giftData} />
                        )}
                    </main>

                    {/* Publish Success Modal */}
                    {showSuccessModal && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/40 backdrop-blur-sm animate-fadeIn">
                            <div className="glass-card max-w-md w-full p-6 rounded-3xl shadow-2xl text-center space-y-4">

                                <h3 className="text-2xl font-serif font-bold text-brand-700">Kado Berhasil Di-Publish!</h3>
                                <p className="text-xs text-brand-700/80 leading-relaxed">
                                    Kado unik siap dikirimkan kepada pasangan/teman spesialmu. Gunakan link publik di bawah ini:
                                </p>

                                <div className="p-3 bg-white/90 border border-brand-200 rounded-2xl flex items-center gap-2">
                                    <input
                                        type="text"
                                        readOnly
                                        value={publishUrl}
                                        className="bg-transparent text-xs text-brand-700 w-full focus:outline-none select-all"
                                    />
                                    <button
                                        onClick={() => copyToClipboard(publishUrl)}
                                        className="bg-brand-600 text-white text-xs px-3 py-1.5 rounded-xl font-medium shrink-0 hover:bg-brand-700"
                                    >
                                        Salin Link
                                    </button>
                                </div>

                                <div className="pt-2 flex gap-2">
                                    <a
                                        href={publishUrl}
                                        target="_blank"
                                        rel="noopener noreferrer"
                                        className="flex-1 py-2.5 text-xs font-bold text-center bg-brand-100 text-brand-700 rounded-xl hover:bg-brand-200"
                                    >
                                        Buka Link ↗
                                    </a>
                                    <button
                                        onClick={() => setShowSuccessModal(false)}
                                        className="flex-1 py-2.5 text-xs font-bold bg-brand-600 text-white rounded-xl hover:bg-brand-700"
                                    >
                                        Selesai 👍
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function EditorWorkspace({ giftData, setGiftData, activeTab, setActiveTab }) {

            return (
                <div className="space-y-4">

                            <LettersTabEditor giftData={giftData} setGiftData={setGiftData} />

                        {activeTab === 'games' && (
                            <GamesTabEditor giftData={giftData} setGiftData={setGiftData} />

                        {activeTab === 'photos' && (
                            <PhotosTabEditor giftData={giftData} setGiftData={setGiftData} />

                        {activeTab === 'settings' && (

                    </div>
                </div>
            );
        }

        function CoverTabEditor({ giftData, setGiftData }) {
            return (
                <div className="space-y-4 max-w-xl mx-auto">
                    <h2 className="text-xl font-serif font-bold text-brand-700 border-b border-brand-200 pb-2">
                        Pengaturan Halaman Depan / Cover
                    </h2>

                    <div>
                        <label className="block text-xs font-bold text-brand-700 mb-1">Judul Utama Kado</label>
                        <input
                            type="text"
                            value={giftData.title}
                            onChange={(e) => setGiftData({ ...giftData, title: e.target.value })}

                            placeholder="Contoh: Happy Birthday My Love! ❤️"
                        />
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <div>
                            <label className="block text-xs font-bold text-brand-700 mb-1">Nama Penerima</label>
                            <input
                                type="text"
                                value={giftData.recipientName}
                                onChange={(e) => setGiftData({ ...giftData, recipientName: e.target.value })}
                                className="w-full p-3 rounded-2xl border border-brand-200 text-xs focus:ring-2 focus:ring-brand-400 outline-none"

                        </div>
                        <div>
                            <label className="block text-xs font-bold text-brand-700 mb-1">Nama Pengirim</label>
                            <input
                                type="text"
                                value={giftData.senderName}
                                onChange={(e) => setGiftData({ ...giftData, senderName: e.target.value })}
                                className="w-full p-3 rounded-2xl border border-brand-200 text-xs focus:ring-2 focus:ring-brand-400 outline-none"
                            />
                        </div>
                    </div>

                    <div>
                        <label className="block text-xs font-bold text-brand-700 mb-1">URL Foto Sampul Depan</label>
                        <input
                            type="text"
                            value={giftData.coverImage}
                            onChange={(e) => setGiftData({ ...giftData, coverImage: e.target.value })}
                            className="w-full p-3 rounded-2xl border border-brand-200 text-xs focus:ring-2 focus:ring-brand-400 outline-none"
                            placeholder="https://..."
                        />
                        {giftData.coverImage && (
                            <img
                                src={giftData.coverImage}
                                alt="Cover preview"
                                className="mt-2 w-full h-40 object-cover rounded-2xl border border-brand-200"
                                onError={(e) => (e.target.src = "https://placehold.co/600x400/e8b5ca/ffffff?text=Image+Error")}
                            />
                        )}
                    </div>
                </div>
            );
        }

        function LettersTabEditor({ giftData, setGiftData }) {
            const addLetter = () => {
                const newLetter = {
                    id: 'let-' + Date.now(),
                    title: 'Judul Surat Baru 💌',
                    subtitle: 'Subjudul singkat...',
                    content: 'Tuliskan pesan romantis dan kenangan manismu di sini...',
                    effect: 'typewriter'
                };
                setGiftData({ ...giftData, letters: [...giftData.letters, newLetter] });
            };

            const updateLetter = (id, key, val) => {
                const updated = giftData.letters.map((letItem) =>
                    letItem.id === id ? { ...letItem, [key]: val } : letItem
                );
                setGiftData({ ...giftData, letters: updated });
            };

            const deleteLetter = (id) => {
                if (giftData.letters.length <= 1) {
                    alert("Minimal harus ada 1 surat!");
                    return;
                }
                const filtered = giftData.letters.filter((letItem) => letItem.id !== id);
                setGiftData({ ...giftData, letters: filtered });
            };

            return (
                <div className="space-y-6">
                    <div className="flex items-center justify-between border-b border-brand-200 pb-2">
                        <h2 className="text-xl font-serif font-bold text-brand-700">Surat & Pesan Rahasia</h2>
                        <button
                            onClick={addLetter}
                            className="flex items-center gap-1 bg-brand-600 text-white text-xs px-3 py-2 rounded-xl font-bold hover:bg-brand-700"
                        >
                            <i data-lucide="plus" className="w-4 h-4"></i> Add New Message
                        </button>
                    </div>

        function RecipientLetters({ letters }) {

        // Catcher Engine
        function CatcherGame({ game }) {
            const [score, setScore] = useState(0);
            const [hearts, setHearts] = useState([]);
            const [isWon, setIsWon] = useState(false);

            useEffect(() => {
                if (score >= game.targetScore) {
                    setIsWon(true);
                    if (window.confetti) window.confetti();
                    return;
                }

                const interval = setInterval(() => {
                    const newHeart = {
                        id: Date.now(),
                        left: Math.random() * 80 + 10
                    };
                    setHearts((prev) => [...prev.slice(-5), newHeart]);
                }, 1200 / game.speed);

                return () => clearInterval(interval);
            }, [score, game]);

            const catchHeart = (id) => {
                setHearts((prev) => prev.filter((h) => h.id !== id));
                setScore((s) => s + 1);
            };

            return (
                <div className="p-4 bg-white/90 rounded-2xl border border-brand-200 text-center space-y-3">
                    <h3 className="font-bold text-sm text-brand-700">{game.title}</h3>
                    <p className="text-xs text-brand-600 italic">{game.instruction}</p>
                    <p className="text-xs font-bold text-brand-700">Skor: {score} / {game.targetScore}</p>

                    <div className="relative h-48 bg-brand-50 rounded-xl overflow-hidden border border-brand-200">
                        {!isWon ? (
                            hearts.map((h) => (
                                <button
                                    key={h.id}
                                    onClick={() => catchHeart(h.id)}
                                    className="absolute text-2xl animate-pulse cursor-pointer transform hover:scale-125 transition"
                                    style={{ left: `${h.left}%`, top: '30%' }}
                                >
                                    💖
                                </button>
                            ))
                        ) : (
                            <div className="flex flex-col items-center justify-center h-full space-y-2">
                                <span className="text-4xl">🏆</span>
                                <p className="text-xs font-bold text-brand-700">{game.winMessage}</p>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        // Passcode Engine
        function PasscodeGame({ game }) {
            const [input, setInput] = useState('');
            const [isWon, setIsWon] = useState(false);

            const checkPass = () => {
                if (input === game.secretPasscode) {
                    setIsWon(true);
                    if (window.confetti) window.confetti();
                } else {
                    alert("Kode salah, coba lagi ya!");
                    setInput('');
                }
            };

            return (
                <div className="p-4 bg-white/90 rounded-2xl border border-brand-200 text-center space-y-3">
                    <h3 className="font-bold text-sm text-brand-700">{game.title}</h3>
                    <p className="text-xs text-brand-600 italic">{game.instruction}</p>
                    <p className="text-[11px] text-brand-700/70 bg-brand-50 p-2 rounded-lg">{game.clue}</p>

                    {!isWon ? (
                        <div className="space-y-2 max-w-xs mx-auto">
                            <input
                                type="password"
                                value={input}
                                onChange={(e) => setInput(e.target.value)}
                                className="w-full text-center p-2.5 rounded-xl border border-brand-200 text-lg font-mono outline-none"
                                placeholder="****"
                            />
                            <button
                                onClick={checkPass}
                                className="w-full py-2 bg-brand-600 text-white text-xs font-bold rounded-xl"
                            >
                                Buka Kunci 🔓
                            </button>
                        </div>
                    ) : (
                        <div className="p-3 bg-green-100 text-green-800 rounded-xl text-xs font-bold animate-bounce">
                            {game.winMessage}
                        </div>
                    )}
                </div>
            );
        }

        // Memory Card Puzzle Engine
        function MemoryGame({ game }) {
            const icons = ['🌸', '💖', '🎁', '⭐', '🌸', '💖', '🎁', '⭐'];
            const [cards, setCards] = useState(() => icons.sort(() => Math.random() - 0.5));
            const [flipped, setFlipped] = useState([]);
            const [matched, setMatched] = useState([]);

            const handleCardClick = (idx) => {
                if (flipped.length === 2 || flipped.includes(idx) || matched.includes(idx)) return;
                const nextFlipped = [...flipped, idx];
                setFlipped(nextFlipped);

                if (nextFlipped.length === 2) {
                    const [first, second] = nextFlipped;
                    if (cards[first] === cards[second]) {
                        setMatched((prev) => [...prev, first, second]);
                        setFlipped([]);
                    } else {
                        setTimeout(() => setFlipped([]), 800);
                    }
                }
            };

            const isWon = matched.length === cards.length;

            return (
                <div className="p-4 bg-white/90 rounded-2xl border border-brand-200 text-center space-y-3">
                    <h3 className="font-bold text-sm text-brand-700">{game.title}</h3>
                    <p className="text-xs text-brand-600 italic">{game.instruction}</p>

                    <div className="grid grid-cols-4 gap-2 max-w-xs mx-auto">
                        {cards.map((icon, idx) => {
                            const isFlipped = flipped.includes(idx) || matched.includes(idx);
                            return (
                                <button
                                    key={idx}
                                    onClick={() => handleCardClick(idx)}
                                    className={`h-16 rounded-xl text-2xl font-bold flex items-center justify-center transition-all transform ${
                                        isFlipped ? 'bg-brand-100 rotate-0' : 'bg-brand-600 text-transparent'
                                    }`}
                                >
                                    {isFlipped ? icon : '❓'}
                                </button>
                            );
                        })}
                    </div>

                    {isWon && (
                        <div className="p-3 bg-brand-100 text-brand-700 rounded-xl text-xs font-bold animate-bounce">
                            {game.winMessage}
                        </div>
                    )}
                </div>
            );
        }

        function RecipientPhotos({ photos }) {
            return (
                <div className="space-y-4">
                    <h3 className="text-center font-serif font-bold text-lg text-brand-700">Galeri Kenangan Indah 📸</h3>
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        {photos.map((p) => (
                            <div key={p.id} className="p-3 bg-white rounded-2xl shadow-md border border-brand-200 space-y-2">
                                <img
                                    src={p.url}
                                    alt={p.caption}
                                    className="w-full h-40 object-cover rounded-xl"
                                    onError={(e) => (e.target.src = "https://placehold.co/400x300/e8b5ca/ffffff?text=Image")}
                                />
                                <span className="text-[10px] font-bold text-brand-600 bg-brand-50 px-2 py-0.5 rounded-md">
                                    {p.category}
                                </span>
                                <p className="text-xs italic text-brand-700">{p.caption}</p>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        function RecipientEnding({ giftData }) {
            return (
                <div className="text-center space-y-4 py-6 animate-fadeIn">
                    <span className="text-6xl animate-bounce inline-block">💖</span>
                    <h3 className="text-2xl font-serif font-bold text-brand-700">Terima Kasih Sudah Membuka Kado Ini!</h3>
                    <p className="text-xs text-brand-700/80 max-w-sm mx-auto leading-relaxed">
                        Semoga hari-harimu selalu dibalut kebahagiaan dan tawa manis.
                    </p>
                    <p className="text-xs font-bold text-brand-600 font-handwriting text-xl">
                        With lots of love, {giftData.senderName}
                    </p>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
